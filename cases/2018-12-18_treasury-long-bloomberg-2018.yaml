notes: 'Says he owns two-, five- and 10-year Treasuries; if the Fed tightens too much and must reverse, ''it''s
  not inconceivable to me at all that the 2-years are back to 50 to 60 basis points in a couple of years''. Says
  he has been short ''all the financials'', including banks, for the same rate reasons: coded as the expression
  equity_us_financials only, since the thesis vocabulary has no sector region and an equity/short/US thesis would
  misstate it (he says he avoids shorting the market: ''you get squeezed out of shorts''). Regime read tightening:
  he urged the Fed to hold off the 2018-12-19 hike (same read as C33) and wants ''this bubble to unwind slowly''.
  Action hold: he states ownership; the article''s ''has been buying'' is the reporter''s summary with no entry
