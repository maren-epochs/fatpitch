notes: 'Switched from long to net short US equities in June 1987: ''The Fed had been tightening since January 1987,
  and the dollar was tanking, which suggested that the Fed was going to tighten some more.'' Valuation (2.6% dividend
  yield, record price/book) set the magnitude; liquidity and narrow breadth set the timing (''I never use valuation
  to time the market''). Action reverse: ''before you switched from long to short''. The 1987-10-16 switch to 130%
  long is a later technical trade and not coded.'
