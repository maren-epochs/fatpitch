notes: 'Short the Japanese stock market (Nikkei): ''just about the best risk/reward trade I had ever seen''. Reasons:
  multiyear overextension, a speculative blow-off, and ''most important—three times as important as everything I
  just said—the Bank of Japan had started to dramatically tighten monetary policy'' (JGBs falling while the Nikkei
  made highs). The BoJ read is tightening; it is recorded here and not as regime_direction, which is a read of US
  policy, and the source states no US read for late 1989. Thesis-only case.'
