# FOMC Summary of Economic Projections (SEP), point in time, 2007-10 meeting onward (76 releases through 2026-09-16;
# no SEP in March 2020). For fatpitch R-68 (Fed projections). Built 2026-10-07 from federalreserve.gov Table 1 pages
# (primary) and ALFRED SEP vintages (cross-check; sole source for 2022-03-16), plus the federal funds "dot plot" tables.
#
# Columns (one row per release x variable x statistic x horizon):
#   meeting       FOMC meeting end date (America/New_York calendar date)
#   published_at  first public release of the numbers, ET 'YYYY-MM-DD HH:MM':
#                 2007-10 .. 2011-01 meetings: with the minutes, 14:00 ET (press releases "For release at 2:00 p.m.")
#                 2011-04-27: 14:15 ET (press release "For release at 2:15 p.m. EDT"; Table 1 only, with the press conference)
#                 2011-06 onward: meeting day 14:00 ET (press releases "For release at 2:00 p.m."), except 2012-04-25 and
#                 2015-06-17 whose releases say "For immediate release" (time unstated): 14:15 ET, conservative
#                 (press-conference start). All 76 release dates equal the ALFRED vintage dates of the SEP series.
#   horizon_year  calendar year of the projection (Q4/Q4 for inflation; Q4 average for unemployment; year-end for the
#                 federal funds rate), or 'LR' (longer run). Current year and next year only, plus LR.
#   variable      pce_inflation | core_pce_inflation | fed_funds_rate | unemployment_rate
#   statistic     median | central_tendency_low | central_tendency_high | range_low | range_high  (as published in Table 1)
#                 dots_median | dots_low | dots_high | dots_count  (computed here from the published dot-plot table of
#                 participants' year-end funds-rate levels, 2012-01-25 .. 2015-09-17; NOT a Fed-published statistic)
#   value         percent
#   src           fed_table1 (federalreserve.gov SEP Table 1 at url) | alfred (ALFRED vintage as of the release date) |
#                 fed_dots (dot-plot table at url)
#   note          optional: data-quality flag
#
# Availability per statistic (no statistic substitutes for another; a missing statistic is absent, not filled):
#   median        published from 2015-09-17 (Table 1 first carries a Median column at the September 2015 SEP).
#                 Before that no median exists at release time. ALFRED *MD series start 2015-12-16; FEDTARMDLR
#                 observations 2012-01-25 .. 2015-09-17 were added to ALFRED on 2015-12-16 (back-filled, not point in time).
#   central tendency / range: PCE, core PCE (no LR), unemployment from 2007-11-20; federal funds rate from 2015-09-17.
#   dots_*        federal funds rate 2012-01-25 .. 2015-09-17 except 2012-12-12 (no dot table in HTML; the compilation
#                 page gives binned levels only). dots_median uses the even-count average convention of Table 1.
#                 Check: dots_median rounded to 0.1 equals the published 2015-09-17 median (0.375 -> 0.4, 1.375 -> 1.4)
#                 and FRED's back-filled FEDTARMDLR for all 15 releases.
#
# Verification (2026-10-07):
#   Fed Table 1 vs ALFRED: 2,584 values agree, 14 differ; Fed kept. 13 are ALFRED stale values at 2015-12-16 (ALFRED's
#     central-tendency/range series carry the 2015-09-17 values through 2016-03-15); 1 is 2012-04-25 (see note).
#   Each Table 1 repeats the previous SEP ("<month> projection" rows): 2,986 stored values checked against the next
#     release's table, 2 differ (2012-04-25 unemployment range_high 2012; 2012-06-20 unemployment range_high LR);
#     both kept as published, with a note.
#   2012-01-25: federalreserve.gov's historical compilation page mislabels Table 1 years (2011-2013 for 2012-2014);
#     the minutes SEP addendum (fomcminutes20120125ep.htm, used here) is labelled correctly and matches ALFRED.
#   Sources not used: SEP compilations of individual participants' projections (released with a five-year lag;
#     using them for any statistic before their release would be look-ahead).
# Reader: one value per row keyed by (variable, statistic, horizon_year); the existing spec_events /
#   spec_events_rate readers do not parse this layout (columns differ: published_at/value, not announced/rate).
version: 2026-10-07.1
