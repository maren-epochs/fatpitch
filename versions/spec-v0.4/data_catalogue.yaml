# Fat Pitch data catalogue: process.md input ids -> amber lake (read-only).
# Consumed by fatpitch.lake.AmberLakeSource. Paths are relative to <AMBER_DATA>\lake.
#
# Fields
#   title, rules (process.md rule ids), step (1 | 1b | later | label), freq (D W M Q A event)
#   status       available | partial (coverage holes) | substitute (stand-in, see grade) | proxy_only | missing
#   pit_method   vintage | first_release | release_calendar | lag_rule | fetch_time  (dominant method; the
#                per-row method is returned in the snapshot frame)
#   revised      true when the source revises history
#   source       latest-revision lake table (kind table): path, date_col, value_col, filter, lag, vintage_col,
#                grade_col / grade_by, unusable_if, year_col, value_map
#   vintages     ordered vintage stores (kind alfred | rtdsm); the first whose first vintage is <= asof is used
#   vintage_by_era  plain-language era rule for the chain above
#   pre_vintage  unknown (default; rows returned usable=False) | usable  -- applies to `source` rows used before
#                any vintage store exists
#   view         first_release: earliest published value per period across `vintages`
#   fallback     ordered: {id | source, proxy_grade, splice}. splice true = prepend fallback rows for periods
#                before the first visible primary period; false = used only when the primary has no visible row
#   proxy_grade  A native; B/C/D per library/research/data_practices.md 4.2 (D -> usable=False)
#   lake         generated at build: rows, first/last period, first published_at (America/New_York) per store
# Fallback grades not taken from amber's proxies/_registry.yaml were computed on the lake overlap (2026-10-07)
# with the 4.2 thresholds on changes; the numbers are in each entry's notes.
version: 2026-10-07.1
lake_root_env: AMBER_DATA
series:
  M2SL:
    title: M2 money stock (H.6), SA
    rules:
    - R-02
    step: '1'
    freq: M
    revised: true
    pit_method: vintage
    source:
      kind: table
      path: fred/series/M2SL.parquet
    vintages:
    - kind: alfred
      path: fred/vintages/M2SL.parquet
      freq: M
      time_from: fred/series/M2SL.parquet
    - kind: rtdsm
      path: longhist/rtdsm/m2.parquet
    vintage_by_era: 'asof >= 1980-02-08 ALFRED; 1971-05-31 <= asof < 1980-02-08 Philadelphia Fed RTDSM (m2, quarterly
      vintages, pre-1980 M2 definition); earlier: none'
    pre_vintage: unknown
    notes: 'RTDSM vintages are quarterly (mid-quarter data, stamped end of vintage month): between vintages the
      latest months are absent. Pre-1971 values exist only as latest revision (post-1980 definition) and are returned
      with usable=False.'
    status: available
    lake:
      source:
        rows: 812
        first_period: '1959-01-31'
        last_period: '2026-08-31'
        first_published: 1959-02-13 16:30
      alfred:
        rows: 28591
        first_period: '1959-01-31'
        last_period: '2026-08-31'
        first_published: 1980-02-08 16:30
