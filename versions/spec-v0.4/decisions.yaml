- id: R67-03
  date: '2026-10-07'
  area: evaluation
  question: What does the anticipation rule do before it has proved itself, and what counts as proof?
  options:
  - label: A
    summary: Warning flag first; becomes a vote in the odds only after passing a new lead-time test with thresholds
      fixed now
  - label: B
    summary: Vote in the odds at once
  chosen: A
  decided_by: owner-on-recommendation
  how_decided: Adding an untested signal to the odds would mix it into Gate 1 results. The new test (scoring.md
    6e) checks each Fed turn from 1970 for the right direction before the first move, the lead in months, and false
