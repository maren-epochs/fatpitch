  - label: D
    summary: 'Relative threshold: above its trailing 120-month median (spec change)'
  chosen: A
  decided_by: owner-on-recommendation
  how_decided: He gives no number. The normal gap between M2 and IP growth is about 3.4 points (real-time and revised
    median), so "a lot faster" was read as above the historical norm; 3.5 is the smallest round value above it.
    The range [1, 7] spans the 27th to 77th percentiles; differences under about 1 point are inside revision noise.
    No engine output or case agreement was checked. The research also found that M2 has no definitional break in
    May 2020, so the R-02 data note was corrected and 2020-03..2021-12 flagged as base-effect outliers. Window stays
    12 months.
