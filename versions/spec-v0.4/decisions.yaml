- id: CORPUS-01
  date: '2026-10-06'
  area: corpus
  question: How should cases where he broke his own rules, and cases driven by unforeseeable events, be scored?
  options:
  - label: A
    summary: Score every case as agreement with his action
  - label: B
    summary: truth_type process (target = the stated rule output; matching his action is a miss) or action; mechanizable
      yes/no tag with no-cases reported as the ceiling
  chosen: B
  decided_by: owner-on-recommendation
  how_decided: The 2000 tech purchase and the 1999 internet short were process violations by his own account; scoring
    them as agreement would reward infidelity (review finding 9). Political catalysts (1992, 2016) cannot be generated
    from data and would lower fidelity without measuring the engine; they are tagged and reported separately. Mistakes
    and failed calls stay in the corpus to avoid hindsight selection.
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - spec/cases_seed.md
  - spec/scoring.md
  expected_result: A fidelity ceiling reported from mechanizable no cases.
  measured_result: 'spec/HOLDOUT.md v5: 7 process and 73 action cases; 70 mechanizable yes, 2 partial, 8 no.'
  status: in force
- id: EVAL-01
  date: '2026-10-06'
  area: evaluation
  question: How should a case be scored and what trivial baselines must the engine beat?
  options:
  - label: A
    summary: Agreement targets with no baselines (plan v0.3)
  - label: B
    summary: Pre-registered per-case rule (regime 1 / 0.5 / 0, thesis, top-3 expression, action), four nulls scored
      identically (always risk-on, Fed direction, 12-month trend, persistence), episode-first aggregation
  chosen: B
  decided_by: owner-on-recommendation
  how_decided: The review (findings 5, 10, 16) showed that about 30 cases cluster in about 10 episodes, that wide
    windows give high random hit rates, and that without a null no target could show the engine beats "always long
    while the Fed eases". Episodes, not cases, are the effective unit. Fat-pitch frequency was removed as a metric
    because it was also the calibration target (circular); it is scored only on held-out years. E.5 performance
    is descriptive only in v1.
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - spec/scoring.md
  expected_result: Fidelity reported against the best null rather than as raw agreement.
  measured_result: 'Unlogged null run 2026-10-06 (spec/scoring.md section 7): era-A thesis recall, full corpus,
    trend 0.461, always risk-on 0.301, Fed direction 0.211, persistence 0.164.'
  status: in force
- id: EVAL-02
  date: '2026-10-06'
  area: evaluation
  question: How should the Duquesne 13F filings be used as evidence?
  options:
  - label: A
    summary: Per-quarter sector rank correlation over all quarters (plan v0.3)
  - label: B
    summary: 'Equity-expression test only: sign of quarter-over-quarter weight change versus the engine tilt change,
      against a no-change persistence baseline; filed date as information date'
  chosen: B
  decided_by: owner-on-recommendation
  how_decided: 13F is long-only US equity with a 45-day lag and says nothing about his FX and rates bets; rank correlation
    over 11 sectors is uninformative and pooled quarters overstate significance (review finding 11). He trades change,
    not level.
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - spec/scoring.md
  expected_result: Reported, not gated.
  measured_result: null
  status: in force
- id: PARAM-01
  date: '2026-10-06'
  area: parameters
  question: How many chosen numbers may be tuned, and how are they tuned?
  options:
  - label: A
    summary: Chronological 60/40 split (plan v0.3)
  - label: B
    summary: Stated numbers fixed; at most 8 interpreted tunables, chosen by leave-one-episode-out fidelity, shown
      across a +/-20% range; held-out scoring once
  chosen: B
  decided_by: owner-on-recommendation
  how_decided: A chronological split puts all pre-2002 monthly cases in training and all daily cases in test, confounding
    era with split (review finding 10). With about 10 episodes, more than a handful of fitted thresholds would overfit;
    a fixed numeric cap was required.
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - spec/registry.yaml
  expected_result: not stated at the time
  measured_result: 'spec/numbers_review.md: 71 chosen numbers, 8 tunable (cap full; none added by later decisions).'
  status: in force
