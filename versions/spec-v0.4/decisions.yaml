- id: DATA-03
  date: '2026-10-06'
  area: data
  question: Should daily futures and FX bars pulled from Interactive Brokers be stored locally?
  options:
  - label: A
    summary: No storage; re-pull each run, log parameters and a hash (first decision)
  - label: B
    summary: Keep IBKR out of decisions; use stored free sources, IBKR only for display and cross-checks (review
      recommendation)
  - label: C
    summary: A plus a persisted trace of every derived input
  - label: D
    summary: Store IBKR bars for v1 roots locally under the curve exception, non-redistributable
  chosen: D
  decided_by: owner
  how_decided: The owner first chose A. The review (finding 29) showed that A makes every live futures decision
    non-replayable and runs two price paths (stored free data for replay, IBKR for live), so the validated engine
    would differ from the shipped one. The review recommended B; the owner reversed to D, which also gives one stored
    price path, about 5 MB, flagged non-redistributable and never sent to AI.
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - memory/ibkr-gateway-access.md
  expected_result: Live and replayed futures decisions use the same stored bars; decisions reproducible from stored
    inputs.
  measured_result: null
  status: in force
