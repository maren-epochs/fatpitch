- id: GATE-02
  date: '2026-10-07'
  area: evaluation
  question: How should the regime stage be judged when nearly all of his reads are "easing"?
  options:
  - label: A
    summary: No regime gate; written regime report; thesis recall (Gate 2) as the single go/no-go
  - label: B
    summary: Engine outputs daily probabilities of easing/neutral/tightening; ranked probability score skill against
      leave-one-episode-out climatology and the 12-month trend null, exact episode sign-flip p < 0.10 on research;
      holdout scored once at the end with a Bayes factor
  - label: C
    summary: Chance-corrected classification gate (kappa, balanced accuracy versus the trend null)
  - label: D
    summary: Repaired timing gate (trend comparator, true regime changes only, pooled at the end)
  chosen: B
  decided_by: owner-on-recommendation
  how_decided: 'Research era-A reads were 25 easing and 2 tightening, both tightening cases in one episode, so any
    agreement or timing test was beaten or gamed by the base rate. Option B is the only one that is not gamed by
    the 92.6% base rate, uses all regime cases instead of two, can reach p < 0.10 on research without opening the
    holdout, and matches the forecast-verification convention (skill against climatology). C rests on one minority
    episode; D has at most 8 cases. Pre-registered constants: floor 0.01, class order easing < neutral < tightening,
    deterministic nulls at 0.9/0.05/0.05 (owner default), missing forecast = worst score, add-one smoothed climatology.
    Diagnostics (bracketed daily agreement, interval-censored turn matching, kappa, balanced accuracy, AUC) are
    reported with chance levels, not gated. Gate 2 stays the hard go/no-go.'
  evidence:
  - spec/regime_evaluation_options.md
  - spec/scoring.md
  - PLAN.md
  - memory/fatpitch-project-plan.md
  expected_result: An engine better in about 7 of 8 research episodes with similar margins reaches p of about 0.05-0.10;
    holdout with about 5 episodes needs 5/5 or 4/5 with a small loss.
  measured_result: 'Nulls on the combined set (scoring.md 6c, 28 cases): always-easing RPS 0.176, climatology 0.183,
    trend 0.246. Committed leaderboard after the v0.3 corpus (32 cases, 13 episodes): climatology 0.246, always-easing
    0.268, trend 0.288; no null passes. First engine run (trial 3, c6fefbd, recorded in spec/decisions_today.yaml):
    RPS 0.249, fail.'
  status: in force
