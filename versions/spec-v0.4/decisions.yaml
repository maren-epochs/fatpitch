  - library/research/article_provenance.md
  - memory/fatpitch-project-plan.md
  expected_result: 'Recorded: the article-faithful version has no rates/FX and no single-name history before 2021-09,
    so its pre-2021 output is limited; coverage is reported beside every score.'
  measured_result: '167 article elements: 17 covered by a Druckenmiller rule, 16 already weight-0 rules, 50 partly
    covered, 84 missing; 16 to the faithful track, 17 article-plus-candidate, 126 article-only, 8 article-only by
    conflict.'
  status: in force
- id: R66-01
  date: '2026-10-07'
  area: evaluation
  question: How should the two policy votes be turned into easing / on-hold / tightening odds so that a correct
    call can beat a forecaster that always says "easing"?
  options:
  - label: A
    summary: 'Weak starting point: each outcome starts at 0.1 instead of 1; agreement gives 0.91, one vote 0.85,
      a split 0.48/0.48'
  - label: B
    summary: 'Near-certain calls: 0.98 on the voted outcome; scoring becomes a plain hit rate'
  - label: C
    summary: 'Size-weighted votes: larger rate moves count more; needs several uncited size constants'
  - label: D
    summary: 'Keep as written: starting point 1, ceiling 0.6'
  chosen: A
  decided_by: owner-on-recommendation
  how_decided: The scoring rule (ranked probability score) was checked against the mapping as written. With a starting
    point of 1 the largest attainable probability was 0.6, so a forecast with every direction right still scored
    0.10 per date against about 0.00 for always-easing in an era that reads easing 93% of the time. Gate 1 was unpassable
    by construction. The first recommendation (approve as written) had not been checked against the scoring rule
    and was withdrawn. Option A keeps the vote count and only weakens the prior; no case outcome was read to choose
    0.1.
  evidence:
  - spec/process.md
  - spec/registry.yaml
  - src/fatpitch/cases/regime.py
  - tests/test_rules_regime.py
  expected_result: The direction called at each date is unchanged (the vote count and tie rule are the same), so
    the Fed-cycle check detection counts and false alarms stay the same. Only the probabilities sharpen. Gate 1
    RPS moves toward 0 on dates where the call is right and toward 1 where it is wrong; because stage 1 still carries
    the faulty holdings signal, the net Gate 1 effect at this stage may be neutral or negative. The point of the
    change is that a good rule can now pass at all.
  measured_result: 'Stage 1 (8bb7d11, trial 4). Calls unchanged as predicted - Fed cycles detected 4/17 and false
    alarms 7.5% both identical to the baseline. Gate 1 RPS worsened 0.249 -> 0.273 (era A 0.266 -> 0.303): sharper
    odds amplified the faulty holdings signal, the ''neutral or negative'' case predicted. The Fed-cycle check criterion
    (a) flipped from pass to fail (skill vs fed-direction -0.036). Gate 1 still fails.'
  status: in force
- id: R14-01
  date: '2026-10-07'
  area: process
  question: How should the Fed's bond holdings count toward the direction of Fed policy?
  options:
  - label: A
    summary: 'Announced programmes: a buying programme in force = easing (taper included), runoff = tightening,
      otherwise nothing'
  - label: B
    summary: Programmes plus a size test on runoff (1% of GDP a year); one uncited constant
  - label: C
    summary: Measured flow of Fed assets against GDP with thresholds; three uncited constants
  - label: D
    summary: Minimal repair of the week-to-week arithmetic; still reads the 2008 cuts as neutral
  chosen: A
  decided_by: owner-on-recommendation
  how_decided: A research pass read every library statement on QE, tapering and QT (30 dated statements) and built
    a table of Fed releases from federalreserve.gov. He describes stimulus as on or off, says to stay long until
    the Fed tightens and to watch the end of QE, calls QT tightening, and never calls a US taper tightening. The
    old arithmetic read 2004-06 hikes and 2008 cuts as neutral and 116 of 174 dates in the 2010s as tightening.
    A matches the statements with no new constants; the owner asked for something "more nuanced that is correct"
    after the first options.
  evidence:
  - spec/research_R14_balance_sheet.md
  - spec/fomc_bs_events.yaml
  - spec/process.md
  expected_result: R-14 reads 2004-06 as tightening, 2008 cuts as easing and 2009-2014 as easing (spot-checked on
    the lake before any scored run). Fewer false tightening dates in 2010-2019, so the Fed-cycle check false-alarm
    share should fall and Gate 1 should improve on the easing-heavy research cases. Disclosed overlap - the runoff
    windows come from the same FOMC statements as the QT windows of the Fed-cycle answer key, so agreement there
    is by construction.
  measured_result: Stage 2 (82bbdf9, trial 5). Gate 1 RPS 0.273 -> 0.232; episodes won vs climatology 6 -> 7 of
    13; 2008 crisis episode 0.137 -> 0.005 and 2012-13 QE episode 0.038 -> 0.005. Fed cycles detected 4 -> 6 of
    17 (1977 and 2004 cycles now found, 2004 one month after the first hike). Against the prediction, false alarms
    rose 7.5% -> 9.3% of easing months and the 2010s decade skill fell (+0.017 -> -0.082); the 2015 hiking cycle
    is still not detected at any stage (unexplained; open item). Gate 1 still fails (binding p 0.454).
  status: in force
- id: R14-02
  date: '2026-10-07'
  area: process
  question: When the rate move and the bond-holdings signal point in opposite directions, which one decides?
  options:
  - label: A
    summary: The rate move wins; holdings decide only when rates are unchanged
  - label: B
    summary: Keep adding the two signals; disagreement reads neutral
  - label: C
    summary: Keep adding, but a slowed runoff counts zero
  chosen: A
  decided_by: owner-on-recommendation
  how_decided: The only long disagreement under the programme table is 2024-09 to 2025-11, when the Fed cut while
    still shrinking its holdings slowly. Adding the signals reads neutral; he read that period as easing (2024-10
    statements). The Fed itself calls the policy rate its primary tool (2022-01-26 principles). The research recommended
    deferring this change to avoid two simultaneous changes; staged measurement (VER-02) removes that concern.
  evidence:
  - spec/research_R14_balance_sheet.md
  - spec/process.md
  expected_result: Changes only dates where rate and programme disagree - 2024-09-18 to 2025-11-30 (neutral to easing)
    and 2019-07-31. Small effect on research cases; possibly none if no research case falls in that window.
  measured_result: 'Stage 3 (c7f1623, trial 6). Larger than predicted: the 2024 cut episode improved 0.723 -> 0.562
    and the 2020s decade skill rose +0.051 -> +0.262. Gate 1 RPS 0.232 -> 0.220, binding p 0.403 (7 of 13 episodes
    won; needs < 0.10). Fed-cycle detection unchanged at 6/17.'
  status: in force
- id: R17-01
  date: '2026-10-07'
