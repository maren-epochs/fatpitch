- id: PROC-15
  date: '2026-10-06'
  area: process
  question: How should decisions be put to the owner?
  options:
  - label: A
    summary: Lettered A-D options with a recommendation and a one-line trade-off, one plain-language question at
      a time; only decisions that need the owner; technical methodology adopted on recommendation and reported
  chosen: A
