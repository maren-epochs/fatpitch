- id: DATA-04
  date: '2026-10-06'
  area: data
  question: What should measure market excess (fragility), and with which free series?
  options:
  - label: A
    summary: 'As first decided: CAPE, BAA-10Y level, margin debt, HY ETF trend, plus an EDGAR unprofitable-IPO share
      from 2009'
  - label: B
    summary: Ritter unprofitable-IPO share 1980 on (stated), SIFMA HY share, Z.1 corporate debt and net equity issuance,
      HY OAS, margin debt; CAPE display only
  - label: C
    summary: B now, plus the EDGAR quarterly IPO share later, validated against Ritter
  - label: D
    summary: A plus manual quarterly entry of B-rated and covenant-lite shares
  chosen: C
  decided_by: owner-on-recommendation
