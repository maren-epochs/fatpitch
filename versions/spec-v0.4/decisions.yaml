- id: PROC-06
  date: '2026-10-06'
  area: process
  question: How should liquidity be measured before 2002, when Fed balance-sheet data are thin?
  options:
  - label: A
    summary: Search for a pre-2002 proxy selected by fit to Fed assets minus TGA minus reverse repo (plan v0.3,
      D-17)
  - label: B
    summary: 'A family of rules scored where each exists: (i) M2 growth minus industrial-production growth 1959
      on (stated, era-B measure); (ii) Fed assets - TGA - RRP 2002 on; (iii) Fed purchases minus net Treasury issuance'
  chosen: B
  decided_by: owner-on-recommendation
  how_decided: The only long-history liquidity rule he states (Feig 2009) is money growth against industrial production.
    Choosing a proxy by fit to a 2020s construction he did not use would make era B a test of a different rule (review
    finding 6). Overlap fit between rules became a diagnostic, not a selection criterion. Cases decided on other
    drivers (1981 real rates, 1992 ERM) score on the stage that applies.
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - spec/process.md
  expected_result: Era-B results reported with their sensitivity to each rule variant.
  measured_result: 'spec/data_coverage.md: the M2-IP rule is computable point-in-time at all 11 research era-B case
    dates; the primary TGA series starts 2002-12, so rule (ii) uses a quarterly proxy (grade C) before then.'
  status: in force
