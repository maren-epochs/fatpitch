# Decision log (rulebook 'Decisions' section; tools/build_rulebook.py).
# One entry per owner or derived design decision. expected_result is the prediction recorded at decision time
# (for entries dated 2026-10-07 session 3, written before any staged result was read); measured_result is added
# afterwards and never replaces the prediction. Entries before 2026-10-07 session 3 were compiled from the spec,
# CHANGELOG and memory files; where a source records no prediction the entry says 'not stated at the time'.
version: 2026-10-07.1
decisions:
- id: DEL-01
  date: '2026-10-06'
  area: delivery
  question: Should the fat-pitch filter be a standalone product or a tab inside the existing amber terminal?
  options:
  - label: A
    summary: A finished-product tab inside amber, using its data layer, database, scheduler and interface
  - label: B
    summary: Standalone application (reference doc section 8, task 6)
  chosen: A
  decided_by: owner
  how_decided: 'Amber already has compiled access to almost every asset class, a data lake and a terminal, so a
    module avoids rebuilding them. The reference document had left module versus standalone open (section 8, task
    6); the owner settled it. The same day the owner ruled out a hosted dashboard (no Vercel): local amber tab only,
    with remote viewing possible later on request.'
  evidence:
  - PLAN.md
  - druckenmiller_fatpitch_reference_1.md
  - memory/fatpitch-project-plan.md
  expected_result: Delivery work reduces to one function (FP) in amber; no separate hosting.
  measured_result: null
  status: in force
- id: PROC-01
  date: '2026-10-06'
  area: process
  question: How should the work be split, and where should the evaluation engine live?
  options:
  - label: A
    summary: Three lifts (Evaluation, Data, Delivery); Evaluation as a separate fatpitch package that amber imports
      through one thin store module
  - label: B
    summary: Evaluation code inside amber itself (implied alternative in PLAN section 0 rationale)
  chosen: A
  decided_by: owner-on-recommendation
  how_decided: The owner set the three-lift structure with Evaluation as the priority. A separate package was chosen
    because fidelity testing needs its own case corpus, pre-registration and versioning, independent of amber's
    release cadence. The review (finding 23) added that the nightly job must import a pinned tagged build, not the
    research working tree, so a half-edited package cannot break amber's nightly run; every run row stores the package
    version and the parameter-registry hash. fatpitch never imports amber.
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - CLAUDE.md
  - memory/fatpitch-project-plan.md
  expected_result: Amber depends on fatpitch, not the reverse; the fidelity suite runs with no amber import.
  measured_result: null
  status: in force
