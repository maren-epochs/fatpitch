- id: PROC-02
  date: '2026-10-06'
  area: process
  question: Where does price action belong in the model?
  options:
  - label: A
    summary: Late confirmation step after the thesis (plan v0.3)
  - label: B
    summary: 'Three roles: a leading input (market internals, step 1b), a hard entry veto (step 4) and an exit trigger
      (price versus news, step 6)'
  chosen: B
  decided_by: owner-on-recommendation
  how_decided: 'The review (findings 1, 7, 8) cited Feig 2009: a good thesis with a bad chart is not traded, a stock
    that fails on good news is sold, and momentum bottoms 12-18 months before fundamentals. A confirmation-only
    stage lost the exit and leading roles. Starter positions follow thesis plus chart; further evidence and a near
    catalyst raise size rather than gate admission ("invest then investigate"); premise breaks can reverse a position
    within a day. His later view that technicals are about 20% as effective lowers timing weight, not the veto.
    Adopted in PLAN Appendix A.'
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - library/discovered_sources/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md
  expected_result: Reversal cases scored on premise-break detection rather than on regime change.
  measured_result: null
  status: in force
- id: PROC-03
  date: '2026-10-06'
  area: process
  question: How should filters that come from the Automated Alpha article rather than from Druckenmiller be treated?
  options:
  - label: A
    summary: Keep as ordinary gates (plan v0.3 stage 4)
  - label: B
    summary: Third tag interpreted-from-article, default weight 0, enabled only if a library citation appears
  chosen: B
  decided_by: owner-on-recommendation
  how_decided: The review (finding 2) found that the forensics, ROIC, insider/13F smart-money and contrarian COT
    gates appear in no primary source, and that contrarian positioning contradicts his stated view (the crowd is
    right about 80% of the time). Every parameter and rule is now tagged stated, interpreted or interpreted-from-article.
    Superseded in part by TRACK-01, which runs the article rules at full weight in a separate version.
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - spec/process.md
  expected_result: The Druckenmiller-faithful engine is unaffected by article gates (weight 0).
  measured_result: null
  status: in force (extended by TRACK-01)
