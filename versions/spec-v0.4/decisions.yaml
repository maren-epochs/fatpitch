- id: R14-04
  date: '2026-10-07'
  area: process
  question: How should the policy-direction rule remember where the Fed is in its cycle between rate moves?
  options:
  - label: A
    summary: Hold the direction of the last rate move until a move in the opposite direction (cycle state)
  - label: B
    summary: Lengthen the look-back window from 6 to 12 months
  - label: C
    summary: Keep the 6-month window
  chosen: A
  decided_by: derived
  how_decided: 'The owner judged the 6-month window ''not a very smart filter'' and delegated the improvement. A
    vote-by-vote print of the engine on the real lake (Fed history only, no case answers) showed the window forgets
    the cycle 6 months after the last move: 2003-05 and 2003-12 to 2004-06 read neutral at 1% rates before any hike,
    2014-11 to 2015-11 neutral at zero rates, 2025-06 to 2025-08 tightening in a cutting cycle. His rule is ''stay
    long until the Fed tightens'' (DS/2014-07-16) and ''the minute they start tightening'' (DS/2021-05-11): a state
    that changes only on the first opposite move. B still resets at long holds (2014-15). Before 1982-09 the policy-rate
    record is the Fed discount rate (discrete Board actions); the fed funds monthly average is too noisy to define
    a last move. The balance-sheet programme keeps the QE-end setback flag but no longer decides direction, because
    a rate state exists at every date after 1950. Anticipating a turn before the first move stays in the hybrid
    track (R67-02).'
  evidence:
  - spec/process.md
  - src/fatpitch/rules/step1.py
  - library/discovered_sources/2014-07-16_delivering-alpha-kernen.md
  expected_result: Written before the run. The 2003-04, 2014-15 and 2025 summer easing periods read easing, so Gate
    1 improves on episodes EP08, EP12 and EP21. The first hike of each cycle flips the state at once, so Fed-cycle
    detection should rise toward the realised-direction reference (14/17) at lag 0 to +1 for cycles after 1982;
    pre-1982 cycles depend on discount-rate timing and may lag. Long holds after the last hike (2006-07, 2019 H1,
    2023-24) now read tightening, so 2024 H1 (EP20) stays wrong and the false-alarm share may rise where the answer
    key labels holds as neutral or easing. Ties between families become rarer because R-14 no longer flips to neutral.
  measured_result: 'Stage 6 (a2a5fc8, trial 9). As predicted, the 2003-04, 2014-15 and 2025 easing episodes improved
    (EP08 0.354 -> 0.288, EP12 0.330 -> 0.137, EP21 0.427 -> 0.213) and 2024 H1 stayed wrong (EP20 0.562). Gate
    1 RPS 0.220 -> 0.184, binding p 0.403 -> 0.266 (7 of 13 episodes beat climatology; needs p < 0.10): still fails.
    Fed-cycle check passes (14/17, lead 0); false alarms fell 17.3% -> 13.6%, against the prediction that they might
    rise. Diagnostic agreement with his daily reads 0.747 -> 0.897 (chance 0.709).'
  status: in force
- id: SCORE-01
  date: '2026-10-07'
  area: evaluation
  question: When the engine's odds tie between two outcomes, which call should the Fed-cycle scorer count?
  options:
  - label: A
    summary: 'The engine''s stated direction (R-66 tie rule: the class R-14 points to)'
  - label: B
    summary: The first class in the list (easing), as numpy argmax returns
  - label: C
    summary: 'Neither: a tied month neither detects a cycle nor counts as a false alarm'
  chosen: A
  decided_by: derived
  how_decided: The owner asked for a review and a decision. R-66 defines the call for a tie and the Decision record
    carries it (policy_direction; decision.py accepts any tied class and rejects others). The scorer's first-class
    rule is an indexing artefact that always favours easing and was never specified. Mechanical fix citing process.md
    R-66 ('policy_direction = argmax P; ties go to the R-14 output'). Applies to every version; reference nulls
    never tie.
  evidence:
  - src/fatpitch/cases/fedcycles.py
  - src/fatpitch/cases/regime.py
  - src/fatpitch/decision.py
  - spec/process.md
  expected_result: Written before the run. The 2015 hiking cycle (tied 0.48/0.48 from 2015-12 with R-14 tightening)
    becomes detected at lag 0. Tied easing-label months where R-14 says tightening count as false alarms, so the
    false-alarm share may rise slightly. Fed-cycle RPS and Gate 1 are unaffected (they use the probabilities).
  measured_result: 'Stage 5 (3fe11c8 rescored, trial 8). Larger than predicted: Fed cycles detected 6/17 -> 14/17
    (median lead 0 months) and the Fed-cycle check now passes all four criteria; the prediction named only the 2015
    cycle. R-14 and the liquidity family disagree often, and every such tied month had been scored as easing. False
    alarms rose 9.3% -> 17.3% of easing months, more than the ''slight'' rise predicted. Gate 1 unchanged (0.220),
    as predicted.'
  status: in force
