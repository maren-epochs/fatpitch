- id: GATE-06
  date: '2026-10-07'
  area: evaluation
  question: Should the engine also be tested against the Fed's own record of tightening and easing, separate from
    his reads?
  options:
  - label: A
    summary: 'Required Fed cycle check: monthly 1970 on, labels from the Fed history; skill against climatology,
      trend and always-easing; tightening detected within 3 months of the first hike in at least 75% of cycles;
      false alarms in easing months at most 20%'
  chosen: A
  decided_by: owner
  how_decided: 'His reads often differ from Fed action (2004-06 still too loose; March 2022 still buying bonds),
    so the documented reads alone cannot show the engine recognises real tightening. The labels are public Fed facts,
    so holdout-period months are scored. Chronology rules are mechanical: target-rate changes from 1982 with runs
    under 0.25 point dropped (1980s 1/16-1/8 point technical moves, which otherwise produce 44 cycles), pre-1982
    turning points of fed funds, QT periods count as tightening, easing dominates. Overall regime pass = Gate 1
    AND this check. Decided before any engine emitted probabilities.'
  evidence:
  - spec/scoring.md
  - spec/fed_cycles.yaml
  - memory/fatpitch-project-plan.md
  expected_result: 'Recorded at the time: the Fed-direction null passes, as expected for a rule close to the label
    definition, and fails Gate 1.'
  measured_result: Chronology 681 months (easing 214, neutral 211, tightening 256), 17 evaluable tightening cycles;
    1990-on changes match the Board's tables 110 of 110. Under the three-reference rule the Fed-direction null passed.
  status: in force (extended by GATE-07)
