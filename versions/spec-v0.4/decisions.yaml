    and +0.630 against the trend null and won 6 of 9 research episodes against trend (p 0.164); one more winning
    episode would have let a constant pass Gate 1 from the base rate alone. Closed before any engine emitted probabilities.
    In plain words: a lazy engine that always says easing would look good but be useless.'
