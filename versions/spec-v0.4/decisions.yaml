- id: R67-05
  date: '2026-10-07'
  area: process
  question: Which R-67 v2 design should be retested?
  options:
  - label: A
    summary: 'V2-B: 2-year spread first, bill forward next; inflation fills hike calls, a stress leg from existing
      rules fills cut calls'
  - label: B
    summary: 'V2-A: minimal fix, no easing-side additions'
  - label: C
    summary: 'V2-D: bill forward first, as before'
  - label: D
    summary: 'V2-C: V2-B plus R-68 from 2007-11'
  chosen: A
  decided_by: owner-on-recommendation
  how_decided: 'The redesign traced the D3 failure to its construction: a one-quarter horizon, flight-to-quality
    distortion of the bill forward, an inflation guard that rarely fires, a discount-yield pricing error (understating
    moves by 4-64bp at 4-15% rates), and neutral readings counting as misses. V2-B puts the 2-year path first, which
    the file notes comes close to the ''adopt the 2-year rule'' option the owner did not pick; the added legs are
    the test of whether anything beyond the 2-year rule helps. Protocol: one design, one run, predictions written
    first, reported as exploratory (same Fed history as the first test).'
  evidence: &id002
  - spec/research_R67_v2_R68.md
  expected_result: 'Written before the retest. Because the 2-year leg comes first, tightening and easing hit rates
    should be at least the naive 2-year rule''s (0.78 and 0.61) unless the inflation guard removes hits, which needs
    broad disinflation at a hike and should be rare. Median leads at least the naive''s (1.5 and 1.0 months). False
    alarms rise above the naive''s (2.03 and 0.36 per year) from the bill and fill-in legs, by under 1 per year
    in each direction. Likeliest failing criteria: the per-era rule (no era with zero hits) for easing in 1982-1993,
    and the false-alarm margin on easing. If it passes, most of the result is the 2-year rule; the report shows
    how many turns each leg decided.'
  measured_result: 'Retest (86a8bbe, results/anticipation/20261007T222616Z; exploratory, same Fed history as the
    first test). FAIL overall on one criterion. Hikes: hit 0.83 (15/18) vs naive 2-year 0.78, median lead 1.0 vs
    1.5 months (criterion 2 fails on lead), false alarms 2.61 vs 2.03 per year (within the +1.0 margin), every era
    with hits. Cuts: hit 0.61 (11/18), lead 1.0, false alarms 0.39 vs 0.36 - all four criteria pass, but identical
    to the naive 2-year rule, so the stress leg added nothing measurable. Prediction right on hit rates and on false
    alarms rising by under 1 per year; wrong on the failing criterion (predicted the 1982-1993 cut era or the cut
    false-alarm margin; actual failure was the hike lead). Per the retest protocol no third design follows; R-67
    stays a warning flag.'
  status: in force
- id: INFL-04
  date: '2026-10-07'
  area: process
  question: How should the four inflation measures combine in R-67?
  options:
  - label: A
    summary: Strict majority of the known measures
  - label: B
    summary: Median reading
  - label: C
    summary: All must agree
  - label: D
    summary: Any two agree
  - label: Other
    summary: 'Owner: split out each signal, weight them, then take a cumulative reading'
  chosen: Other
  decided_by: owner
  how_decided: 'Owner answer: ''split out each signal weight them and then take a cumulative insight from there''.
    Read as: each measure (CPI, core CPI, PCE, core PCE) keeps its own momentum reading, reported separately; the
    composite is a weighted average of the known readings (at least 2) compared with the same band. Weights are
    precision weights - the inverse variance of each measure''s month-to-month change in its momentum reading over
    the trailing 120 months as of the date (at least 36 months), so steadier measures count more. Uses no outcome
    data and no hand-picked weights; the 120-month window is a fixed definition (one full policy cycle). Applies
    to the inflation leg only; the market, inflation and stress legs keep the V2-B order. Pre-run note (from data
    availability at implementation, before any scoring): before 1996-12 only one measure is usable on the lake (headline
    CPI; pre-1996 unadjusted core CPI rows are revised values and unusable, PCE vintages start 2000-08), so the
    composite is absent before 1997 rather than CPI-only as the prediction assumed; the V2-B inflation guard and
    inflation fill-in therefore act only from 1997. The prediction is left as written.'
  evidence: *id002
  expected_result: Written before the retest. Core measures are steadier than headline, so they get more weight,
    damping energy shocks as the majority rule would have, but continuously. Before 2000-08 only the CPI measures
    exist, so the composite is CPI-only there.
  measured_result: Retest as R67-05. The composite is absent before 1997 (one usable measure), so it can only have
    acted on the 1999, 2004, 2015 and 2022 hike cycles and the 2001, 2007, 2019 and 2020 cut cycles; per-turn deciding
    components are in results/anticipation/20261007T222616Z/turns.csv.
  status: in force
- id: R68-02
  date: '2026-10-07'
  area: tracks
  question: Where should R-68 (inflation versus the Fed's own projection) go?
  options:
  - label: A
    summary: Faithful track, 'too loose' side only
  - label: B
    summary: Hybrid track only
  - label: C
    summary: Faithful, both sides
  - label: D
    summary: A vote in the regime odds
  chosen: B
  decided_by: owner
  how_decided: Recommended was the faithful track on the 'too loose' side, since the theme is his verbatim (DS/2021-01).
    The owner chose hybrid only. R-68 = core PCE 6-month annualised minus the median SEP core PCE projection for
    the current year (central-tendency midpoint before medians began 2015-09), band 0.5 points held 2 month ends;
    from 2007-11 only; reported in the hybrid track, not an R-67 input (V2-C was not chosen).
  evidence: *id002
  expected_result: 'No faithful-track output changes. Expected from public history: reads ''Fed behind'' through
    2021 and much of 2022, and ''ahead'' in parts of 2012-2016 when inflation ran under projections.'
  measured_result: Computed in the retest run as a report-only column (hybrid track); no gate. See results/anticipation/20261007T222616Z/report.md.
  status: in force
- id: R67-06
  date: '2026-10-07'
  area: process
  question: Fix the bill-forward pricing error and the unadjusted-CPI distortion before the retest?
  options:
  - label: A
    summary: Both fixes
  - label: B
    summary: Pricing fix only
  - label: C
    summary: Neither
  chosen: A
