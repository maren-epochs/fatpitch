  status: in force
- id: PROC-13
  date: '2026-10-07'
  area: process
  question: How should the engine turn its rule outputs into daily regime probabilities?
  options:
  - label: A
    summary: Count evidence families with unit weight (R-14 Fed direction; the era-appropriate liquidity rule),
      each adding mass to the class it points to, from a base mass; floored and renormalised; unknown families add
      nothing; no fitted calibration
  chosen: A
  decided_by: derived
  how_decided: 'Required by the probability output adopted in GATE-02 (R-66, phase E3), written before any engine
    output was scored. No source states such a mapping, so a transparent count was chosen. Excluded with reasons:
    level measures (Taylor gap, financial conditions; "change, not level"), rules that take policy direction as
    an input (circular), veto flags, fragility (never sets direction), duration evidence and equity internals. All
    three constants non-tunable because the cap of 8 is full. Rules are weighted by the process timeline (held or
    not held by era; unknown era counts as held).'
  evidence:
  - spec/process.md
  - spec/registry.yaml
  - spec/claims/process_timeline.yaml
  expected_result: 'Recorded: probabilities are coarse by design (few families, no fitted calibration); calibration
    out of scope until E7.'
  measured_result: Before scoring, the base mass of 1.0 was found to cap probabilities at 0.6 and make Gate 1 unpassable;
    that revision is recorded in spec/decisions_today.yaml (R66-01).
  status: in force (base mass revised 2026-10-07, R66-01)
- id: PROC-14
  date: '2026-10-07'
  area: process
  question: Should the process be fixed, or change over time the way his views changed?
  options:
  - label: A
    summary: 'Time-varying: each rule active only from when he held it (process timeline), plus a second test layer
      that turns each general claim he made into a falsifiable hypothesis tested out of sample after he first said
      it'
  chosen: A
  decided_by: owner
  how_decided: 'The owner''s aim is to recreate his way of thinking over time and test it backwards. Two layers
    result: fidelity (does the engine reach his dated calls) and claim tests (76 claims, each with a pre-registered
    test and an out-of-sample split at its first public statement). Claims were formalised without reading cases
    or scores. Where the start date of a belief has no evidence, replay should score both ways.'
  evidence:
  - spec/claims/README.md
  - spec/claims/claims.yaml
  - spec/claims/process_timeline.yaml
  - memory/fatpitch-project-plan.md
  expected_result: 'Recorded: many claims were first stated in 2022-26, so out-of-sample windows of four years or
    less are anecdotal.'
  measured_result: '76 claims: 51 testable, 17 partly testable, 8 untestable with free data. Known evidence from
    notes: the net liquidity claim failed in its first month (2020-05 to 06); the 2022-24 disinflation without a
    dated recession counters two inflation claims; the 2022 inversion was followed by no recession.'
  status: in force
- id: TRACK-01
  date: '2026-10-07'
  area: tracks
  question: Should every filter in the Automated Alpha article be built, and how should it sit next to the Druckenmiller
    rules?
  options:
  - label: A
    summary: 'Pre-decision recommendation per element: adopt, weight-0 variant, or exclude where it conflicts with
      his stated process'
  - label: B
    summary: 'Build every article element as an interpreted-from-article rule; three comparable versions on the
      leaderboard: Druckenmiller-faithful, article-faithful, hybrid'
  chosen: B
  decided_by: owner
  how_decided: The owner asked that all filters in the article be included. Elements that contradict his stated
    process (price stops, fixed profit targets, contrarian positioning, quality gates, nightly re-weighting on profits)
    run only in the article track; in the hybrid, the R-xx rule governs on overlap and those elements are disabled.
    Article numbers are used as published and fixed; paywalled internals are interpreted constructions fixed before
