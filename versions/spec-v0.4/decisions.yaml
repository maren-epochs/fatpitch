  decided_by: owner-on-recommendation
  how_decided: His documented large bets are in bonds and currencies (1981, 1992, 2000, 2013, 2016, 2022), with
    equities rarely above 100% net long; fidelity tests therefore live in rates and FX (review section A).
  evidence:
