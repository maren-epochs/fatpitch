  - PLAN_REVIEW.md
  expected_result: Fragility cases in 1999-2000, 2006-07 and 2013-15 become scorable.
  measured_result: 'spec/data_coverage.md: the fragility rule (R-11) runs on 3 of 6 components before 1997 and 6
    of 6 from 1999; HY OAS, SIFMA share and margin debt start 1996-97.'
