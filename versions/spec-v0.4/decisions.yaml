- id: PROC-08
  date: '2026-10-06'
  area: process
  question: What rule prevents the engine from using information before it was public?
  options:
  - label: A
    summary: Source.snapshot(asof) returns value, period_end, published_at, vintage_id; filter published_at <= asof,
      never period_end; asof tz-aware New York; property test at E0
  chosen: A
  decided_by: owner-on-recommendation
  how_decided: 'Review findings 14, 15 and 22: H.4.1 balance-sheet data are dated Wednesday but published Thursday
    afternoon (a one-day leak if joined on observation date), and output-gap inputs are heavily revised. Fixes adopted:
    publication timestamps from the FRED release calendar, H.4.1 shifted to Thursday 16:30 ET, an unemployment-gap
    Taylor variant on ALFRED vintages, rows without published_at excluded. No alternative is recorded.'
  evidence:
  - PLAN.md
  - PLAN_REVIEW.md
  - CLAUDE.md
  - spec/process.md
  expected_result: No row with published_at after asof is ever returned (tested property).
  measured_result: 'spec/data_coverage.md: point-in-time snapshot of 67 step-1 inputs takes 9.5 ms (target under
    50 ms).'
  status: in force
