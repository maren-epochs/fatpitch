# Fat Pitch — parameter registry v1 (E1, 2026-10-06; numbers evidence pass 2026-10-06)
# Keys: id, value, range, tag, citation, notes, tunable
# Tags: stated (number given by the source) | interpreted (choice made here)
#       | interpreted-from-article (Automated Alpha origin; default weight 0)
# Cap (PLAN E.6): at most 8 entries with tunable: true, all tag interpreted.
# Tunable set is chosen by leave-one-episode-out fidelity; ranges shown are the
# search ranges; fidelity must be reported across each range (±20% minimum).
# A range on a non-tunable entry is descriptive: a stated band, or a band across
# which fidelity is reported without fitting.
# Every interpreted entry carries "evidence: <grade>" in notes:
#   direct (he gave the number or an explicit equivalent) | anchored (derived from
#   numbers he cited about his own reasoning; arithmetic shown) | convention
#   (standard practice; named) | none. No value was chosen by checking case outcomes.
# Every number used in a spec\process.md formula is a registry id (no hard-coded constants).
# Citations: library\<dir>\<file>. "DS" = discovered_sources, "RS" = reference_sources.
# stated values are never tuned. Changing any entry changes the registry sha.


