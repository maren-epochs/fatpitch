method: 'Episode-level draw, numpy.random.default_rng(seed); every list sorted before each draw. n_target = round(n_episodes
  / 3). (1) Gate 1 episodes (episodes with an era-A turning-point case with a regime target; turning points by turning_point_ids
  on the full corpus): ceil(n / 2) drawn by rng.permutation. (2) If exactly two episodes contain 13F cases (targets.tilt):
  exactly one is held out; if step 1 took none, one is drawn by rng.permutation; if it took both, the one drawn
  second by rng.permutation is returned to research and replaced by an undrawn non-13F Gate 1 episode drawn by rng.permutation.
  (3) If no held-out episode is era B (all cases era B), one era-B episode is drawn by rng.permutation. (4) The
  remaining episodes (13F episodes excluded when step 2 applied) are permuted and added in that order until n_target
  is reached. Hash: fatpitch.cases.schema.corpus_sha256.'
