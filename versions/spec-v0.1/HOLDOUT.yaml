  second by rng.permutation is returned to research and replaced by an undrawn non-13F Gate 1 episode drawn by rng.permutation.
  (3) If no held-out episode is era B (all cases era B), one era-B episode is drawn by rng.permutation. (4) The
  remaining episodes (13F episodes excluded when step 2 applied) are permuted and added in that order until n_target
  is reached. Hash: fatpitch.cases.schema.corpus_sha256.'
