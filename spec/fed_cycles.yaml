rule:
  events: '1982-09-27..2008-12-15 changes of FRED DFEDTAR; 2008-12-16.. changes of FRED DFEDTARU (the splice step
    1.00 -> 0.25 counts as a cut); before 1982-09: turning points of monthly FEDFUNDS (extreme within +-6 months,
    alternation, adjacent moves >= 1.0 pp); tightening = month after trough .. peak, easing = month after peak ..
    trough'
  cycles: consecutive same-sign changes form one cycle (first change month .. last change month); same-direction
    cycles across the 1982-09 and 2008-12 splices are merged
  label: easing if inside an easing cycle; else tightening if inside a tightening rate cycle or a QT period; else
    neutral (pause)
