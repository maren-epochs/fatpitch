# Fed balance-sheet programme regime (R-14 holdings component, R-17 QE state; owner decision 2026-10-07).
# Source: spec/research_R14_balance_sheet.md section 2 (federalreserve.gov releases fetched 2026-10-07).
# Read by fatpitch.lake (kind: spec_events) as series FOMC_BS_STATE.
#
# Each row is a state change:
#   announced    release time of the statement, America/New_York (published_at; never used before it)
#   effective    date from which the new state holds (period_end). Equal to the announcement date for
#                programme starts and runoff starts; the stated completion date for programme ends, which the
#                Fed published in advance (no look-ahead).
#   state        EXPAND (net purchases or maturity extension in force: easing) | RUNOFF (announced runoff in
#                force: tightening) | NONE (neither, incl. reinvestment-only and technical reserve-management
#                purchases the FOMC labelled as no change of stance)
#   time_verified  false = release time from memory; every such release precedes 16:00 ET (same-day visibility
#                at the close is unaffected)
# Taper and slowdown phases keep the state (rows kept as `sub` notes, no sign effect).
# The first row records the baseline: no programme from the Federal Reserve Banks' opening (1914-11-16) until
# QE1, so a replay date before 2008-11-25 reads NONE rather than unknown.
version: 2026-10-07.1
events:
