- id: C-08
  title: Net liquidity (Fed purchases minus Treasury net issuance) governs equity risk/reward
  topic: liquidity_policy
  testability: testable
  importance: 4
  reliability: S
  rules: [R-03, R-04]
  quotes:
  - {text: "So it's the biggest liquidity injection relative to history I've ever seen.", source: RS/2020-05-12_economic-club-of-new-york.md, date: 2020-05-12, reliability: S}
  - {text: "And then liquidity shrinks as far as the eye can see as the Treasury borrowing crowds out not only the private economy but even overwhelms Fed purchases.", source: RS/2020-05-12_economic-club-of-new-york.md, date: 2020-05-12, reliability: S}
  first_public_statement: {date: 2020-05-12, source: RS/2020-05-12_economic-club-of-new-york.md, note: "Felder verbatim excerpt; ECNY transcript not reviewed."}
  timeline:
    held_from: {date: 2020-05-12, basis: stated, evidence: "ECNY 2020.", source: RS/2020-05-12_economic-club-of-new-york.md}
    changes:
    - {date: 2020-06-08, change: "Call reversed within four weeks; breadth thrust and Fed scale overrode the net-liquidity read.", source: DS/2020-06-08_cnbc-squawk-box-humbled-underestimated-fed.md}
    - {date: 2022-09-28, change: "Liquidity accounting extended to TGA drawdown and SPR.", source: DS/2022-09-28_delivering-alpha-kernen-transcript.md}
    held_until: null
    weight_history: [{from: 2020-05, weight: core}, {from: 2020-06, weight: reduced, note: "subordinate to breadth/price (inferred)"}]
    dating: thin
    dating_note: "No pre-2020 statement of the net formula."
  statement: "When Treasury net issuance exceeds Fed purchases, effective liquidity shrinks and equity forward returns are poor."
  hypothesis:
    variables:
      NETF: "13w change (TREAST + WSHOMCB) - TFD_NET_ISSUANCE_13W"
      NL: "WALCL - WTREGEN - RRPONTSYD, 13w change (R-03 sensitivity)"
      R: "EQ_US forward 13w and 26w excess return"
    thresholds:
    - {param: window, basis: interpreted, default: 13w, sensitivity: [4w, 26w]}
    H1: "E[R | NETF < 0] < E[R | NETF > 0]."
  test:
    event: state
    sample: "2005-06 -> 2026-09 (TFD 13w series start)"
    frequency: W
    outcome: "conditional means; IC"
    holds_if: "spread > 5pp/yr, p < 0.10, both NETF and NL variants same sign"
    fails_if: "spread <= 0"
  oos: {split: 2020-05-12, in_sample: "2005-06 -> 2020-05", out_of_sample: "2020-05 -> 2026-09"}
  data:
    available: [TREAST, WSHOMCB, WALCL, WTREGEN, RRPONTSYD, TFD_NET_ISSUANCE_13W (2005-06), TFD_DEBT_HELD_PUBLIC (1997-09), FF_MKT_RF_D]
    missing: ["pre-1997 daily issuance (FYGFDPUN quarterly only)"]
  caveats: ["First OOS observation (2020-05) failed immediately.", "Bills vs coupons issuance mix ignored."]

