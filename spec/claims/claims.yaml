  test: {event: none, sample: "1926 -> 2026 (EQ_US), 1971 -> (FX)", frequency: D/W/M, outcome: "IC term structure", holds_if: "peak in band for >= 2 of 3 frequencies", fails_if: "IC <= 0 throughout"}
  oos: {split: 2009-10-01, in_sample: "to 2009-09", out_of_sample: "2009-10 -> 2026"}
  data: {available: [FF_MKT_RF_D, DEX* FX, GOLD_LBMA], missing: []}
