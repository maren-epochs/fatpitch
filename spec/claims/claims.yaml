  first_public_statement: {date: 2022-06-10, source: DS/2022-06-XX_sohn-2022-john-collison.md, note: "Same conversation: expected the rule to break this cycle (FF would need ~8%)."}
  timeline:
    held_from: {date: 2022-06-10, basis: stated, evidence: "Sohn 2022.", source: DS/2022-06-XX_sohn-2022-john-collison.md}
