  test: {event: EP list, sample: "1954 -> 2026 (FF); 1914 -> with stand-in", frequency: M, outcome: "counterexample count", holds_if: "zero counterexamples 1954-2021", fails_if: ">= 1 counterexample 1954-2021"}
  oos: {split: 2022-06-10, in_sample: "1954 -> 2021", out_of_sample: "2022-2023 disinflation (he predicted a counterexample)"}
  data: {available: [CPIAUCSL, CPIAUCNS, FEDFUNDS, DFF], missing: ["pre-1954 policy rate NEW (1946-1951 peg and 1920s-40s episodes otherwise excluded)"]}
  caveats: ["Headline CPI includes energy shocks (1990 Gulf episode near 6%).", "The 2022 'break' depends on decline definition: FF exceeded headline CPI ~2023-05."]

