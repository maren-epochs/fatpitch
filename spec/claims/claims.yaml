# Druckenmiller testable-claims catalogue (spec\claims\claims.yaml)
# Built 2026-10-07 from library\discovered_sources (DS/), library\reference_sources (RS/), spec\process.md,
# spec\data_catalogue.yaml (version 2026-10-07.1) and library\research\data_practices.md.
# Not read: cases\, spec\scoring.md, spec\HOLDOUT.md, results\. No claim below was shaped by fidelity cases or scores.
#
# Field conventions
#   testability     testable | partially_testable | untestable_free_data
#   importance      1..5 (5 = core of the documented process; liquidity/policy/inflation weighted up)
#   reliability     best source tier for the quote: P primary, NP near-primary transcript, S secondary summary
#   quotes          <= 2 sentences each, verbatim as recorded in the cited library note (S quotes not audio-verified)
#   timeline        held_from: earliest dated evidence he held/used the belief (basis stated = he gives the date,
#                   inferred = date deduced from an action or retrospective context); changes: dated revisions;
#                   held_until: null while no abandonment is evidenced; dating: adequate | thin
#   thresholds      basis stated = his number; interpreted = pre-registered default with sensitivity range
#   oos             out-of-sample = data after first_public_statement.date; in-sample = data before it
#   data            ids from spec\data_catalogue.yaml unless marked NEW (free, not yet in the catalogue; loader needed)
#                   or MISSING (no free source known). "(id unverified)" = FRED id not confirmed this session.
#   PIT             outcome labels (NBER dates, realized returns) may use revised data; conditioning inputs are run
#                   twice: vintage/first-release (real-time variant, primary) and latest revision (sensitivity).
# Common definitions used by several claims
#   EQ_US      US equity index: FF_MKT_RF_D + FF_RF_D cumulated (1926-07 ->, daily); SHILLER_SP monthly (1871 ->)
#              for pre-1926 and long-horizon tests. S&P 500 daily (SP500) is MISSING; NASDAQCOM 1971 ->.
#   BEAR       peak-to-trough decline >= 20% in EQ_US (closing basis), peak = prior all-time-high close.
#   RECESSION  NBER_CYCLES / USREC (labels only).
#   CPI_YOY    yoy(CPIAUCSL) 1948 ->; yoy(CPIAUCNS) 1914 -> for the long sample.
#   FF         FEDFUNDS (1954-07 ->); pre-1954 policy-rate stand-in = MISSING in catalogue (NEW: NY Fed discount
#              rate / commercial paper rate, NBER Macrohistory on FRED, id unverified).
#   TG         Taylor gap per R-06 (FF minus rule rate; registry params policy.*).
version: 2026-10-07.1
claims:
- id: C-01
  title: Liquidity and the Fed, not earnings, move the overall market
  topic: liquidity_policy
  testability: testable
  importance: 5
  reliability: NP
  rules: [R-01, R-13]
  quotes:
  - {text: "The other thing he taught me is earnings don't move the overall market; it's the Federal Reserve Board.", source: RS/2015-01-18_lost-tree-club-speech.md, date: 2015-01-18, reliability: NP}
  - {text: "I never use valuation to time the market. I use liquidity considerations and technical analysis for timing.", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md, date: 1991-12, reliability: P}
  - {text: "I think the stock market is basically a function of central bank policy.", source: DS/2017-12-12_cnbc-closing-bell-kelly-evans.md, date: 2017-12-12, reliability: NP}
  first_public_statement: {date: 1991-12, source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md, note: "Interview Dec 1991, book 1992. The 'not earnings ... Federal Reserve Board' wording in NMW is widely quoted but unverified; Lost Tree 2015 is the verified verbatim."}
  timeline:
    held_from: {date: 1977, basis: inferred, evidence: "Lost Tree: Drelles taught him this before leaving ~3 months after promoting him; he joined Pittsburgh National Bank 1977 and the Shah fell (Jan 1979) 'right after he leaves'.", source: RS/2015-01-18_lost-tree-club-speech.md}
    changes:
    - {date: 2024-11-06, change: "Macro increasingly done 'bottom up' by listening to companies; company mosaics named main macro input (2026). Liquidity primacy not withdrawn.", source: RS/2024-11-06_nbim-in-good-company-podcast.md}
    held_until: null
    weight_history:
    - {from: 1977, weight: core}
    - {from: 2024, weight: core, note: "co-equal with company-level mosaics (DS/2026-02-27)"}
    dating: adequate
  statement: "Index-level US equity returns are driven mainly by monetary policy and liquidity, not by earnings growth."
  hypothesis:
    variables:
      R12: "EQ_US forward 12m total return (monthly, overlapping; Newey-West)"
      LIQ: "block {yoy(M2SL)-yoy(INDPRO) (R-02), 12m change FF, 12m change Fed assets/GDP (US_CB_ASSETS_M/GDP)}"
      EPS: "block {realized 12m forward EPS growth (Shiller E, NEW loader field), trailing 12m EPS growth}"
    thresholds:
    - {param: horizon_m, basis: interpreted, default: 12, sensitivity: [6, 24]}
    H1: "Incremental R2 of LIQ on R12 exceeds incremental R2 of trailing EPS growth (real-time information set). Secondary: contemporaneous 12m returns co-move more with LIQ than with same-period EPS growth."
  test:
    event: none (time-series regression)
    sample: "1960-01 -> 2026-08 (M2SL from 1959); long variant 1919 -> with FF stand-in"
    frequency: M
    outcome: "partial R2, sign hit rate, rolling 10y stability"
    holds_if: "LIQ block partial R2 > trailing-EPS partial R2 in full sample and in >= 2/3 of rolling decades"
    fails_if: "trailing-EPS block dominates or LIQ partial R2 not distinguishable from 0 (p > 0.10)"
  oos: {split: 1991-12-31, in_sample: "1960-1991", out_of_sample: "1992-2026", note: "Verified-wording split 2015-01-18 reported as sensitivity."}
  data:
    available: [M2SL (1959, vintage), INDPRO (1919, vintage), FEDFUNDS (1954), US_CB_ASSETS_M (1914), GDP (1947), FF_MKT_RF_D (1926), SHILLER_SP (1871)]
    missing: ["Shiller earnings field not loaded (NEW: extend SHILLER_SP loader)", "realized forward EPS uses revised data (outcome-side only)"]
  caveats: ["Realized forward EPS growth is look-ahead by construction; compare only real-time EPS block for the decision claim.", "Liquidity and earnings are endogenous (policy reacts to growth).", "Claim is about 'the overall market'; security-level earnings matter by his own account (Feig 2009)."]

- id: C-02
  title: Money supply growing much faster than industrial production lifts stocks
  topic: liquidity_policy
  testability: testable
  importance: 5
  reliability: NP
  rules: [R-02]
  quotes:
  - {text: "If you have the money supply growing a lot faster than industrial production, the stock market is generally going to go up.", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md, date: 2009-Q4, reliability: NP}
  first_public_statement: {date: 2009-10-01, source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md, note: "Internal evidence dates the talk to Q4 2009; 2009-10-01 is the conservative split."}
  timeline:
    held_from: {date: 2008-03, basis: inferred, evidence: "Feig 2009: March 2008 long commodities on expected global liquidity despite a bearish economic view.", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}
    changes:
    - {date: 2013-05-08, change: "Liquidity framed via central-bank QE/balance sheets rather than M2-IP from Sohn 2013 onward (inferred: no later M2-IP statement).", source: DS/2013-05-08_sohn-commodities-conundrum.md}
    - {date: 2023-05-09, change: "Money-supply level (M1 ~$19T vs ~$4T 2019) cited as residual liquidity (S).", source: DS/2023-05-09_sohn-2023-kiril-sokoloff.md}
    held_until: null
    weight_history:
    - {from: 2008, weight: core, note: "era B measure"}
    - {from: 2013, weight: reduced, note: "balance-sheet measures dominate statements (inferred)"}
    dating: thin
    dating_note: "No evidence before 2008 that M2-IP specifically was used; Drelles-era 'movement of liquidity' undefined."
  statement: "When money growth exceeds industrial-production growth by a wide margin, US equities tend to rise."
  hypothesis:
    variables:
      L2: "yoy(M2SL) - yoy(INDPRO_FR), vintage as of t"
      R: "EQ_US forward 6m and 12m excess return"
    thresholds:
    - {param: liq.m2_ip.spread_pp ('a lot faster'), basis: interpreted, default: 3.0, sensitivity: [0.0, 6.0]}
    - {param: growth window, basis: interpreted, default: 12m yoy, sensitivity: [6m annualized, 24m annualized]}
    H1: "E[R | L2 > 3pp] > E[R | unconditional] and P(R > 0 | L2 > 3pp) > base rate; E[R | L2 < 0] < unconditional."
  test:
    event: "months with L2 above threshold (state); also first month of crossing (event, 3m confirmation per liq.confirm_periods)"
    sample: "1960-01 -> 2026-08; flag 2020-03..2021-12 base-effect outliers (process.md R-02)"
    frequency: M
    outcome: "conditional vs unconditional forward excess return; hit rate; block bootstrap p-value"
    holds_if: "conditional 12m mean excess return exceeds unconditional by > 2pp/yr and hit rate exceeds base rate, p < 0.10, in both halves"
    fails_if: "difference <= 0 or sign reverses in one half"
  oos: {split: 2009-10-01, in_sample: "1960-01 -> 2009-09", out_of_sample: "2009-10 -> 2026-08"}
  data:
    available: [M2SL (vintage ALFRED 1980-02 ->, RTDSM 1971-05 ->), INDPRO / INDPRO_FR (1919), FF_MKT_RF_D, SHILLER_SP]
    pit: "M2SL pre-1971 latest revision only (usable=False); real-time variant starts 1971-05."
    missing: []
  caveats: ["M1/M2/base unspecified; M2 chosen (process.md R-02).", "2020 IP base effects dominate L2.", "Overlapping windows: few independent observations."]

- id: C-03
  title: Liquidity overrides a bearish economic view
  topic: liquidity_policy
  testability: testable
  importance: 5
  reliability: NP
  rules: [R-01, R-02, R-04, R-14, R-60]
  quotes:
  - {text: "I'm a liquidity guy. I'm not… that worried about markets.", source: DS/2019-06-07_cnbc-squawk-box-one-way-bet.md, date: 2019-06-07, reliability: NP}
  - {text: "I underestimated how many red lines, and how far, the Fed would go.", source: DS/2020-06-08_cnbc-squawk-box-humbled-underestimated-fed.md, date: 2020-06-08, reliability: S}
  first_public_statement: {date: 2009-10-01, source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md, note: "Long commodities Mar 2008 and long equities 2009 despite bearish economic view."}
  timeline:
    held_from: {date: 2008-03, basis: stated, evidence: "Feig 2009 retrospective on March 2008 commodities trade.", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}
    changes:
    - {date: 2019-12-18, change: "Self-diagnosed under-risking a liquidity rally in 2019 ('couldn't have been more wrong') - lesson reaffirmed.", source: DS/2019-12-18_bloomberg-schatzker-couldnt-have-been-more-wrong.md}
    - {date: 2020-06-08, change: "May 2020 bearish net-liquidity read reversed within four weeks; Fed scale plus breadth overrode it.", source: DS/2020-06-08_cnbc-squawk-box-humbled-underestimated-fed.md}
    held_until: null
    weight_history: [{from: 2008, weight: core}]
    dating: adequate
  statement: "When liquidity is expanding, risk assets rise even while economic data are weak."
  hypothesis:
    variables:
      WEAK: "yoy(INDPRO_FR) < 0 or RECESSION = 1 (label) or UNRATE_FR 6m change > +0.5pp"
      LIQPOS: "L2 > liq.m2_ip.spread_pp (C-02) OR 6m change FF < 0 OR 26w change WALCL > 0 (2002 ->)"
      R: "EQ_US forward 12m excess return"
    thresholds:
    - {param: weakness definition, basis: interpreted, default: "yoy INDPRO_FR < 0", sensitivity: ["UNRATE 6m +0.5pp", "USREC"]}
    H1: "E[R | WEAK and LIQPOS] > 0 and > E[R | WEAK and not LIQPOS]."
  test:
    event: "state months"
    sample: "1960 -> 2026"
    frequency: M
    outcome: "2x2 conditional mean returns; hit rates"
    holds_if: "WEAK&LIQPOS mean > 0, exceeds WEAK&notLIQPOS by > 5pp, p < 0.10"
    fails_if: "WEAK&LIQPOS mean <= WEAK&notLIQPOS"
  oos: {split: 2009-10-01, in_sample: "1960 -> 2009-09", out_of_sample: "2009-10 -> 2026"}
  data:
    available: [M2SL, INDPRO_FR, FEDFUNDS, WALCL (2002-12), UNRATE_FR, USREC, FF_MKT_RF_D]
    missing: []
  caveats: ["Easing typically begins in weakness; selection overlaps with recession troughs (mechanical rebound).", "Counter-episodes 2001 and 2007-08: easing during bear markets."]

- id: C-04
  title: Stay long until the Fed tightens; tightening onset ends liquidity-driven rallies
  topic: liquidity_policy
  testability: testable
  importance: 5
  reliability: NP
  rules: [R-14, R-06]
  quotes:
  - {text: "And normally the playbook says exactly what you said. You don't have to move till they raise rates.", source: DS/2014-07-16_delivering-alpha-kernen.md, date: 2014-07-16, reliability: NP}
  - {text: "This bubble has gone long enough and it's extended enough that the minute they start tightening, the equity market should go down a lot.", source: DS/2021-05-11_hustle-mfm-trung-phan.md, date: 2021-05-11, reliability: NP}
  - {text: "The Fed had been tightening since January 1987, and the dollar was tanking, which suggested that the Fed was going to tighten some more.", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md, date: 1991-12, reliability: P}
  first_public_statement: {date: 1991-12, source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md, note: "Retrospective reads of 1981, 1987 (Fed) and 1989 (BoJ) tightening as sell triggers; general playbook verbatim 2014-07-16."}
  timeline:
    held_from: {date: 1981-06, basis: stated, evidence: "NMW: mid-1981 rates at 19% 'one of the more obvious sell situations'; June 1987 Fed tightening; late 1989 BoJ tightening 'three times as important'.", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md}
    changes:
    - {date: 2014-07-16, change: "Variant: watch the rate level more than the first hike; QE end also a risk event.", source: DS/2014-07-16_delivering-alpha-kernen.md}
    - {date: 2021-05-11, change: "Variant: after a bubble, the first tightening itself is the trigger.", source: DS/2021-05-11_hustle-mfm-trung-phan.md}
    held_until: null
    weight_history: [{from: 1981, weight: core}]
    dating: adequate
  statement: "Equities keep rising while policy is easy; the onset of Fed tightening (and, in his 2014 variant, the level reached) precedes equity declines, especially after a bubble."
  hypothesis:
    variables:
      ONSET: "first month with FF target (DFEDTAR/DFEDTARU; FEDFUNDS 3m-avg rise >= 50bp pre-1982) higher than 6m earlier after >= 12m without a hike"
      DD: "max EQ_US drawdown within 6/12/18m of ONSET"
      R: "EQ_US return over 12m after ONSET"
      BUBBLE: "fragility_level = high (R-11) or CAPE top-quintile at ONSET"
    thresholds:
    - {param: drawdown threshold, basis: interpreted, default: 10%, sensitivity: [7%, 20%]}
    - {param: window, basis: interpreted, default: 18m, sensitivity: [6m, 24m]}
    - {param: 'rate-level variant (DA 2014)', basis: interpreted, default: "TG crosses above 0 (policy no longer loose)", sensitivity: ["FF > CPI_YOY", "TG > +1pp"]}
    H1: "P(DD >= 10% within 18m | ONSET) > P(DD >= 10% within any 18m window); median R after ONSET < unconditional median."
    H1b: "Among ONSETs, BUBBLE onsets have larger DD (supports 2021 variant)."
    H1c: "Rate-level trigger has higher DD hit rate than ONSET trigger (supports 2014 variant)."
  test:
    event: "tightening onsets 1955 -> 2026 (~16 events); cross-country variant with BIS policy rates and OECD share prices (JP 1989, DE)"
    sample: "1955-01 -> 2026-09"
    frequency: M (D for drawdowns)
    outcome: "hit rate vs base rate; conditional median returns; Fisher exact test"
    holds_if: "hit-rate excess > 15pp and median 12m return below unconditional"
    fails_if: "hit rate not above base rate"
  oos: {split: 1991-12-31, in_sample: "onsets 1955-1988", out_of_sample: "onsets 1994, 1999, 2004, 2015, 2022 (2021-variant OOS: 2022 only)"}
  data:
    available: [FEDFUNDS (1954), DFEDTAR (1982-2008), DFEDTARU (2008), DFF, FF_MKT_RF_D, SHILLER_SP, JP_POLICY_RATE, DE_POLICY_RATE, GB_POLICY_RATE_BIS]
    missing: ["FOMC_CALENDAR MISSING in catalogue (onset dating uses rate series)", "Foreign equity indices NEW: OECD SPASTT01{JP,DE,GB}M661N (FRED, id unverified)"]
  caveats: ["n ~ 16 US onsets; overlap with recessions.", "1994 and 2004 onsets: no 10% decline within 18m in common recollection - verify in test, do not presume.", "Onset definition before 1982 (no target series) is interpreted."]

- id: C-05
  title: QE inflates financial asset prices
  topic: liquidity_policy
  testability: testable
  importance: 5
  reliability: NP
  rules: [R-12, R-14, R-24]
  quotes:
  - {text: "The one thing we learned in the United States about QE is it definitely inflates financial asset prices.", source: DS/2015-03-02_cnbc-closing-bell-kelly-evans.md, date: 2015-03-02, reliability: NP}
  - {text: "When monetary stimulus is on, I'm long gold. When stimulus is off, I'm less long.", source: DS/2012-04-XX_grants-spring-conference-jim-grant.md, date: 2012-04, reliability: S}
  first_public_statement: {date: 2012-04-15, source: DS/2012-04-XX_grants-spring-conference-jim-grant.md, note: "'Trade the monetary stimulus' (S). Verified verbatim 2015-03-02."}
  timeline:
    held_from: {date: 2009-Q4, basis: inferred, evidence: "Feig 2009: long equities on liquidity while Fed bought $20-25bn/week.", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}
    changes:
    - {date: 2020-06-08, change: "Underestimated the scale effect of 2020 QE; belief strengthened.", source: DS/2020-06-08_cnbc-squawk-box-humbled-underestimated-fed.md}
    held_until: null
    weight_history: [{from: 2009, weight: core}]
    dating: adequate
  statement: "Periods of central-bank asset purchases coincide with above-normal returns on equities, credit and gold."
  hypothesis:
    variables:
      QE: "26w change in (TREAST + WSHOMCB) > 0 with a declared purchase program (US 2008-11 -> 2014-10, 2019-10 -> 2022-03); BoJ/ECB analogues from asset series"
      R: "weekly excess returns EQ_US, GOLD_LBMA, BAA-GS10 spread change"
    thresholds:
    - {param: QE flag, basis: interpreted, default: "26w holdings change > 1% of GDP annualized", sensitivity: ["> 0", "> 2% of GDP"]}
    H1: "Annualized excess return during QE > outside QE (2002 -> 2026), for EQ_US and gold; credit spreads narrow during QE."
  test:
    event: "QE-on vs QE-off weeks"
    sample: "2002-12 -> 2026-09 (US); 2001 -> (BoJ), 2009 -> (ECB, BoE)"
    frequency: W
    outcome: "difference in annualized returns, block bootstrap"
    holds_if: "QE-on excess return > QE-off by > 5pp/yr for EQ_US, p < 0.10, and same sign in >= 2 of 3 non-US regions"
    fails_if: "difference <= 0"
  oos: {split: 2012-04-15, in_sample: "2002-12 -> 2012-04", out_of_sample: "2012-04 -> 2026 (QE3, QE4)"}
  data:
    available: [TREAST, WSHOMCB, WALCL (2002-12), JPNASSETS, JP_BOJ_TOTAL_ASSETS (1998), EUROSYSTEM_TOTAL_ASSETS (1999), BOE_ASSETS (partial), GOLD_LBMA, BAA, GS10, FF_MKT_RF_D]
    missing: ["Purchase-program announcement dates (FOMC_CALENDAR MISSING)"]
  caveats: ["4 US QE episodes; regimes not independent.", "QE starts at market lows (mean-reversion confound)."]
- id: C-06
  title: Markets suffer setbacks within about six months of QE ending
  topic: liquidity_policy
  testability: partially_testable
  importance: 4
  reliability: NP
  rules: [R-14]
  quotes:
  - {text: "The only nuance I would put is the market had a nasty setback after QE1 ended. Had a nasty setback after QE2 ended.", source: DS/2014-07-16_delivering-alpha-kernen.md, date: 2014-07-16, reliability: NP}
  first_public_statement: {date: 2012-04-15, source: DS/2012-04-XX_grants-spring-conference-jim-grant.md, note: "QE rallies 'came apart within about six months of ending' (S summary)."}
  timeline:
    held_from: {date: 2010-06, basis: inferred, evidence: "Lesson drawn from QE1 end (2010-03) setback; stated 2012.", source: DS/2012-04-XX_grants-spring-conference-jim-grant.md}
    changes: []
    held_until: null
    weight_history: [{from: 2012, weight: active}, {from: 2018, weight: active, note: "generalized into balance-sheet rate of change (C-07)"}]
    dating: thin
    dating_note: "No statement after 2014; status after 2014 inferred from C-07."
  statement: "When a QE program ends, risk assets have a material setback within roughly six months."
  hypothesis:
    variables:
      END: "QE program end dates: US 2010-03-31, 2011-06-30, 2012-12-31 (Twist), 2014-10-29, 2022-03-09; JP 2006-03-09; EA 2018-12-31, 2022-06-30"
      DD: "max drawdown of local equity index within W months after END"
    thresholds:
    - {param: W, basis: stated, default: 6, sensitivity: [3, 9]}
    - {param: setback size, basis: interpreted, default: 10%, sensitivity: [5%, 15%]}
    H1: "P(DD >= 10% within 6m | END) > P(DD >= 10% within a random 6m window)."
  test:
    event: "program end dates (fixed list above, pre-registered)"
    sample: "2006 -> 2026"
    frequency: D
    outcome: "hit count vs binomial base rate from all 6m windows 2002-2026"
    holds_if: "hit rate >= 2x base rate"
    fails_if: "hit rate <= base rate"
  oos: {split: 2014-07-16, in_sample: "ends 2006-2012", out_of_sample: "ends 2014-10, 2018-12 (EA), 2022-03, 2022-06 (EA)"}
  data:
    available: [FF_MKT_RF_D, NASDAQCOM]
    missing: ["Program end dates are a manual event list (FOMC_CALENDAR MISSING)", "Foreign index daily NEW"]
  caveats: ["n = 8; binomial power minimal.", "Program-end dates are known in advance (announced tapers) - expectation effects."]

- id: C-07
  title: The rate of change of central-bank balance sheets drives risk assets
  topic: liquidity_policy
  testability: testable
  importance: 5
  reliability: NP
  rules: [R-03, R-12, R-14]
  quotes:
  - {text: "It's all about liquidity, and liquidity is going down.", source: DS/2018-10-09_grants-fall-conference-jim-grant.md, date: 2018-10-09, reliability: S}
  - {text: "Fed should pause its double-barreled blitz of higher interest rates and tighter liquidity.", source: DS/2018-12-16_wsj-oped-warsh-fed-tightening-not-now.md, date: 2018-12-16, reliability: S}
  first_public_statement: {date: 2018-09-06, source: RS/2018-09-06_sokoloff-real-vision-interview.md, note: "Global CB buying ~$1T/yr going to zero within 12 months (NP notes)."}
  timeline:
    held_from: {date: 2018-01, basis: inferred, evidence: "Real Vision: expected the rate of change to hit equities 'from mid-year' and was wrong for months.", source: RS/2018-09-06_sokoloff-real-vision-interview.md}
    changes:
    - {date: 2022-09-28, change: "QT netted against TGA drawdown and SPR releases.", source: DS/2022-09-28_delivering-alpha-kernen-transcript.md}
    - {date: 2023-04-24, change: "Emergency facilities (SVB) counted as reversing QT.", source: DS/2023-04-24_nbim-annual-investment-conference.md}
    held_until: null
    weight_history: [{from: 2018, weight: core}]
    dating: adequate
  statement: "Equities weaken when aggregate central-bank asset growth decelerates (second derivative turns negative) and strengthen when it accelerates."
  hypothesis:
    variables:
      G: "USD sum of Fed (WALCL), Eurosystem (EUROSYSTEM_TOTAL_ASSETS x DEXUSEU), BoJ (JP_BOJ_TOTAL_ASSETS / DEXJPUS)"
      F: "12m change of G (flow); D2 = 6m change of F"
      R: "EQ_US forward 6m excess return"
    thresholds:
    - {param: flow window, basis: interpreted, default: 12m, sensitivity: [6m, 24m]}
    - {param: acceleration window, basis: interpreted, default: 6m, sensitivity: [3m, 12m]}
    H1: "E[R | D2 < 0] < E[R | D2 > 0]; corr(D2_t, R_t+6m) > 0."
  test:
    event: "state (sign of D2); events = sign changes"
    sample: "2003-01 -> 2026-09 (all three series)"
    frequency: M
    outcome: "conditional means, IC with HAC errors"
    holds_if: "IC > 0.10 with p < 0.10 and conditional spread > 5pp/yr"
    fails_if: "IC <= 0"
  oos: {split: 2018-09-06, in_sample: "2003-2018-08", out_of_sample: "2018-09 -> 2026-09"}
  data:
    available: [WALCL (2002-12), EUROSYSTEM_TOTAL_ASSETS (1999), JP_BOJ_TOTAL_ASSETS (1998), DEXUSEU, DEXJPUS, FF_MKT_RF_D]
