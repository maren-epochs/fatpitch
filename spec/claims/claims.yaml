  first_public_statement: {date: 2009-10-01, source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}
  timeline: {held_from: {date: 2009-10-01, basis: stated, evidence: "Feig 2009.", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}, changes: [], held_until: null, weight_history: [{from: 2009, weight: active}, {from: 2018, weight: reduced, note: "via C-53"}], dating: thin}
  statement: "Momentum (rate-of-change) signals on a given bar frequency carry predictive information for about 8-20 bars of that frequency."
