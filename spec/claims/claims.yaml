- id: C-60
  title: Valuation does not time markets; liquidity and technicals do; valuation sets how far a move goes
  topic: valuation
  testability: testable
  importance: 4
  reliability: P
  rules: [R-13, R-01]
  quotes:
  - {text: "I never use valuation to time the market. I use liquidity considerations and technical analysis for timing.", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md, date: 1991-12, reliability: P}
  - {text: "So anybody who says they are not a bubble, I just don't agree with it… Because the bubble is appropriate given monetary policy.", source: DS/2014-07-16_delivering-alpha-kernen.md, date: 2014-07-16, reliability: NP}
  first_public_statement: {date: 1991-12, source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md}
  timeline: {held_from: {date: 1981, basis: inferred, evidence: "1987: valuation sets how far once tightening is the catalyst; mid-1981 valuation plus 19% rates.", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md}, changes: [{date: 2024-10-16, change: "Selling NVDA on valuation called a big mistake (reaffirms).", source: DS/2024-10-16_bloomberg-tv-sonali-basak.md}], held_until: null, weight_history: [{from: 1981, weight: "context only"}], dating: adequate}
  statement: "At 1-12 month horizons valuation has little predictive power relative to liquidity and trend signals; conditional on a bearish catalyst, higher starting valuation means a larger decline."
  hypothesis:
    variables: {CAPE: "Shiller CAPE (NEW field) or market cap/GDP", LIQ: "C-02/C-04 signals", TREND: "10m SMA filter", DD: "drawdown after tightening onset (C-04)"}
    thresholds: [{param: horizon, basis: interpreted, default: 12m, sensitivity: [3m, 6m]}]
    H1a: "OOS R2 at 12m: CAPE < LIQ + TREND."
    H1b: "corr(starting CAPE, DD after ONSET) > 0."
  test: {event: "regressions; ONSET events", sample: "1881 -> 2026 (CAPE); 1955 -> (onsets)", frequency: M, outcome: "OOS R2 comparison; correlation", holds_if: "H1a and H1b", fails_if: "CAPE dominates short-horizon prediction"}
  oos: {split: 1991-12-31, in_sample: "to 1991", out_of_sample: "1992 -> 2026"}
  data: {available: [SHILLER_SP, M2SL, INDPRO_FR, FEDFUNDS], missing: ["Shiller earnings (CAPE) NEW", "Z.1 equity market value (NEW) for market cap/GDP"]}
  caveats: ["Valuation known to forecast long horizons, not short; H1a likely holds by known result."]

- id: C-61
  title: High starting valuation implies a flat decade
  topic: valuation
  testability: testable
  importance: 3
  reliability: NP
  rules: [R-13]
  quotes:
  - {text: "We've had a hurricane behind us for 30 or 40 years, and it's reversing… the Dow won't be much higher in ten years than it is today.", source: DS/2022-09-28_delivering-alpha-kernen-transcript.md, date: 2022-09-28, reliability: NP}
  - {text: "If we have borrowed from the future and markets value the future, we should be selling at a discount, not a premium to historic valuations.", source: DS/2016-05-04_sohn-the-endgame.md, date: 2016-05-04, reliability: S}
  first_public_statement: {date: 2016-05-04, source: DS/2016-05-04_sohn-the-endgame-archived-transcript.md, note: "18x inflated vs 7x depressed earnings (1982)."}
