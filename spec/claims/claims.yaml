  - {text: "...by the time we get done analyzing I will miss 30 or 40% of the move and then I'm paralyzed...", source: RS/2023-XX-XX_nbim-investment-conference-2023.md, date: 2023-04-24, reliability: S}
  first_public_statement: {date: 2022-06-10, source: DS/2022-06-XX_sohn-2022-john-collison.md}
  timeline: {held_from: {date: 1992-08, basis: inferred, evidence: "Sterling starter before analysis (invest then investigate).", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}, changes: [{date: 2023-04-24, change: "30-40% missed (different number).", source: DS/2023-04-24_nbim-annual-investment-conference.md}], held_until: null, weight_history: [{from: 1992, weight: active}], dating: thin}
  statement: "After a material catalyst, most of the eventual price adjustment happens in the first 2-3 weeks."
