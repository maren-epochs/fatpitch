  oos: {split: 2022-06-10, in_sample: "to 2022-05", out_of_sample: "2022-06 -> 2026"}
  data: {available: [daily FX, DGS10, FF_MKT_RF_D], missing: ["'idea surfacing' undefined; monetary surprise series NEW"]}
  caveats: ["Conditioning on M120 sign is look-ahead (descriptive claim only)."]

