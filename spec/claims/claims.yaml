    thresholds: [{param: reaction window, basis: interpreted, default: 3 trading days, sensitivity: [1, 5]}]
    H1: "E[F | S > 0 and RX < 0] < E[F | S > 0 and RX > 0]; effect smaller after cutover year (consistent with C-53)."
  test: {event: release days, sample: "1960 -> 2026 (release dates from ALFRED)", frequency: event, outcome: "conditional forward returns by era", holds_if: "negative difference pre-cutover, p < 0.10", fails_if: "no difference pre-cutover"}
  oos: {split: 2009-10-01, in_sample: "to 2009-09", out_of_sample: "2009-10 -> 2026"}
  data: {available: [INDPRO_FR, UNRATE_FR, FF_MKT_RF_D], missing: ["consensus surprises MISSING (free)", "single-stock earnings surprises MISSING"]}
