    variables: {SIG: "sign of 2nd-derivative ROC on daily/weekly/monthly bars (R-18 construction)", IC_k: "rank IC of SIG with forward k-bar return"}
    thresholds: [{param: horizon band, basis: stated, default: "8-20 bars", sensitivity: []}]
