- id: C-53
  title: Technical analysis is about 20% as effective as it used to be
  topic: technicals_timing
  testability: testable
  importance: 4
  reliability: NP
  rules: [R-32, R-29, R-30]
  quotes:
  - {text: "I can unequivocally tell you that technical analysis is about 20% as effective today as it was then because no one was using it.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md, date: 2026-01-30, reliability: NP}
  - {text: "Drelles was very technically oriented... However, I found that technical analysis could be very effective.", source: RS/1992-XX-XX_new-market-wizards-chapter.md, date: 1991-12, reliability: NP}
  - {text: "And when you take away price action versus news from someone who's used price action news as their major disciplinary tool for 35 years, it's tough...", source: RS/2018-09-06_sokoloff-real-vision-interview.md, date: 2018-09-06, reliability: NP}
  first_public_statement: {date: 2026-01-30, source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md, note: "Degradation first stated 2018-09-06 (algos)."}
  timeline:
    held_from: {date: 1977, basis: stated, evidence: "Technicals learned from Drelles; 'very effective'.", source: RS/1992-XX-XX_new-market-wizards-chapter.md}
    changes:
    - {date: 2018-09-06, change: "Algorithms cancelled price-vs-news and relative-strength signals.", source: RS/2018-09-06_sokoloff-real-vision-interview.md}
    - {date: 2022-06-10, change: "Price vs news much weaker than 20 years earlier.", source: DS/2022-06-XX_sohn-2022-john-collison.md}
    - {date: 2023-04-24, change: "Degraded because hedge funds, algos, quants learned the game.", source: DS/2023-04-24_nbim-annual-investment-conference.md}
    - {date: 2026-01-30, change: "~20% of former effectiveness.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md}
    held_until: null
    weight_history: [{from: 1977, weight: core}, {from: 2018, weight: reduced}, {from: 2026, weight: "0.2 of original (timing); chart veto retained"}]
    dating: adequate
  statement: "Returns to standard technical rules have decayed to roughly one fifth of their earlier level as the rules became widely used."
  hypothesis:
    variables: {TR: "standard rules: 12m time-series momentum, 10m SMA filter, 6m industry relative strength (French 12), on EQ_US, GS10-proxy bonds, DEX* FX, gold", SR: "rolling 10y Sharpe of each rule"}
    thresholds: [{param: cutover year, basis: interpreted, default: 2010, sensitivity: [2005, 2015]}, {param: effectiveness ratio, basis: stated, default: 0.20, sensitivity: [0.1, 0.4]}]
    H1: "SR(post-cutover)/SR(pre-cutover) <= 0.4 averaged across rules and assets; point estimate near 0.2."
  test: {event: none, sample: "1926 -> 2026 (equities), 1971 -> (FX), 1953 -> (bonds)", frequency: M, outcome: "Sharpe ratios by era; ratio CI by block bootstrap", holds_if: "ratio CI upper bound < 0.6", fails_if: "ratio CI lower bound > 0.8"}
  oos: {split: 2018-09-06, in_sample: "to 2018-08 (decay first claimed)", out_of_sample: "2018-09 -> 2026"}
  data: {available: [FF_MKT_RF_D, FRENCH12_*, GS10, DEX* FX, GOLD_LBMA, AQR TSMOM as validation (NEW)], missing: []}
  caveats: ["His technicals are discretionary (272 charts); standard rules are a proxy.", "Decay of published anomalies is a known literature result (McLean-Pontiff)."]

- id: C-54
  title: Daily, weekly and monthly charts predict 8-20 bars ahead
  topic: technicals_timing
  testability: testable
  importance: 2
  reliability: NP
  rules: [R-18, R-29]
  quotes:
