- id: C-55
  title: Price action against good news is a sell signal
  topic: technicals_timing
  testability: partially_testable
  importance: 3
  reliability: NP
  rules: [R-30, R-51]
  quotes:
  - {text: "If all the news is great and the stock's not acting well, get out.", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md, date: 2009-Q4, reliability: NP}
  - {text: "If I've got a thesis and it's really bullish and it's playing out and the stock's not going anywhere, makes me go back and check the thesis over and over.", source: DS/2023-04-24_nbim-annual-investment-conference.md, date: 2023-04-24, reliability: NP}
  first_public_statement: {date: 2009-10-01, source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}
  timeline: {held_from: {date: 1983, basis: stated, evidence: "'major disciplinary tool for 35 years' (2018).", source: RS/2018-09-06_sokoloff-real-vision-interview.md}, changes: [{date: 2018-09-06, change: "Cancelled by algos.", source: RS/2018-09-06_sokoloff-real-vision-interview.md}, {date: 2026-01-30, change: "Degraded with technicals (~20%).", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md}], held_until: null, weight_history: [{from: 1983, weight: core}, {from: 2018, weight: reduced}], dating: adequate}
  statement: "An asset that fails to rise on good news subsequently underperforms."
  hypothesis:
