  timeline: {held_from: {date: 1987, basis: inferred, evidence: "Read The Alchemy of Finance (published 1987) before joining Soros 1988 (Lost Tree).", source: RS/2015-01-18_lost-tree-club-speech.md}, changes: [{date: 1991-Q1, change: "Exited DEM when Germany talked of tax rises (fiscal premise ended).", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md}], held_until: null, weight_history: [{from: 1987, weight: active}], dating: thin, dating_note: "No statement after 1991."}
  statement: "Country-years with a widening deficit and a rising policy rate see currency appreciation."
  hypothesis:
    variables: {FISC: "change in general-government deficit/GDP (OECD, NEW)", MON: "12m change policy rate", FXR: "forward 12m trade-weighted or vs USD return"}
    thresholds: [{param: fiscal expansion, basis: interpreted, default: ">= 1pp of GDP deficit widening", sensitivity: ["0.5pp", "2pp"]}, {param: tightening, basis: interpreted, default: ">= 100bp", sensitivity: ["50bp"]}]
    H1: "E[FXR | FISC and MON] > E[FXR] across G7 panel."
  test: {event: country-years, sample: "1973 -> 2026, G7", frequency: A, outcome: "conditional mean, panel regression", holds_if: "> 3pp, p < 0.10", fails_if: "<= 0"}
  oos: {split: 1991-12-31, in_sample: "1973 -> 1991", out_of_sample: "1992 -> 2026"}
  data: {available: [policy rates (BIS series), DEX* FX], missing: ["OECD fiscal balances NEW; FYFSGDA188S MISSING (US)"]}
  caveats: ["Classic Mundell-Fleming case (US 1981-85, DE 1990); few clean episodes."]

- id: C-51
  title: Governments defending prices against fundamentals always lose
  topic: fx
  testability: partially_testable
  importance: 2
  reliability: S
  rules: [R-28]
  quotes:
  - {text: "Governments defending prices against fundamentals always lose. The only variable is how much they spend before conceding.", source: DS/2026-08-24_wsj-oped-let-the-bond-market-speak.md, date: 2026-08-24, reliability: S}
  first_public_statement: {date: 2026-08-24, source: DS/2026-08-24_wsj-oped-let-the-bond-market-speak.md}
  timeline: {held_from: {date: 1992-08, basis: inferred, evidence: "Sterling trade thesis: linked currencies with divergent outlooks.", source: RS/2015-01-18_lost-tree-club-speech.md}, changes: [], held_until: null, weight_history: [{from: 1992, weight: active}], dating: adequate}
  statement: "Pegs, bands, floors and yield caps defended against adverse fundamentals are eventually abandoned."
  hypothesis:
    variables: {EV: "pre-registered list of defended price regimes with an adverse-fundamentals flag (ERM 1992-93, MXN 1994, THB 1997, RUB 1998, BRL 1999, ARS 2001, CHF floor 2015, BoJ YCC 2016-2024, US yield peg 1942-51, HKD 1983-, DKK 1982-)", FUND: "adverse = inflation differential > 3pp or current-account deficit > 4% GDP or reserves falling > 25%/yr"}
    thresholds: [{param: adverse-fundamentals flag, basis: interpreted, default: as above, sensitivity: ["any one criterion", "two criteria"]}]
    H1: "Every EV with FUND = true ends in abandonment; survival rate of FUND = false regimes higher."
  test: {event: EV list, sample: "1942 -> 2026", frequency: event, outcome: "abandonment counts", holds_if: "100% abandonment among FUND = true", fails_if: "any FUND = true regime survives >= 10y"}
  oos: {split: 2026-08-24, in_sample: "to 2026-08", out_of_sample: "2026 Treasury buyback episode onward"}
  data: {available: [DEX* FX, policy rates], missing: ["Event list manual; foreign CPI and reserves (IMF IFS, NEW)"]}
  caveats: ["'Against fundamentals' is judged after the fact; partially testable.", "Survivor regimes (HKD) are the obvious counterexample test."]

- id: C-52
