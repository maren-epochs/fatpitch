- id: C-59
  title: A long stretch of no progress with high volatility precedes a major trend change
  topic: technicals_timing
  testability: testable
  importance: 1
  reliability: P
  rules: []
  quotes:
  - {text: "The lack of progress and volatility in global equity markets the past year, which often precedes a major trend change, suggests that their risk/reward is negative without substantially lower prices and/or structural reform.", source: DS/2016-05-04_sohn-the-endgame-archived-transcript.md, date: 2016-05-04, reliability: P}
  first_public_statement: {date: 2016-05-04, source: DS/2016-05-04_sohn-the-endgame-archived-transcript.md}
  timeline: {held_from: {date: 2016-05-04, basis: stated, evidence: "Sohn 2016.", source: DS/2016-05-04_sohn-the-endgame-archived-transcript.md}, changes: [], held_until: null, weight_history: [{from: 2016, weight: minor}], dating: thin}
  statement: "After 12 months of near-zero equity return with above-median volatility, the probability of a large move (either sign) in the next 12 months is above normal."
