- id: C-35
  title: The 10-year yield trades around nominal GDP growth
  topic: rates_bonds
  testability: testable
  importance: 4
  reliability: NP
  rules: [R-56]
  quotes:
  - {text: "The golden rule I've always had is the ten year's to trade around where nominal GDP is, which is five and a half percent.", source: DS/2024-10-16_bloomberg-tv-sonali-basak.md, date: 2024-10-16, reliability: NP}
  first_public_statement: {date: 2023-10-24, source: DS/2023-10-24_robin-hood-paul-tudor-jones.md, note: "10y fair value 4.5-5% with 2% inflation (S). Verbatim rule 2024-10-16."}
  timeline: {held_from: {date: unknown, basis: stated, evidence: "'I've always had' - undated career-long claim.", source: DS/2024-10-16_bloomberg-tv-sonali-basak.md}, changes: [{date: 2026-08-24, change: "10y 'at or below nominal GDP growth' used as evidence yields too low.", source: DS/2026-08-24_wsj-oped-let-the-bond-market-speak.md}], held_until: null, weight_history: [{from: 2023, weight: active}], dating: thin, dating_note: "No dated use before 2023."}
  statement: "The 10-year Treasury yield mean-reverts toward trailing nominal GDP growth; a large negative gap predicts rising yields."
  hypothesis:
    variables: {GAP: "DGS10 (GS10 pre-1962) - yoy(GDP vintage)", GAP5: "sensitivity: 5y average nominal GDP growth", dY: "forward 12m change in DGS10"}
    thresholds: [{param: anchor gap, basis: interpreted, default: "-1.5pp", sensitivity: ["-1pp", "-2.5pp"]}]
    H1: "Full-sample mean GAP not different from 0 (+/-1pp); E[dY | GAP < -1.5pp] > 0 and corr(GAP, dY) < 0."
  test: {event: state, sample: "1953 -> 2026", frequency: Q, outcome: "mean gap; predictive regression of dY on GAP", holds_if: "|mean GAP| <= 1pp and slope < 0, p < 0.10", fails_if: "persistent gap or slope >= 0"}
  oos: {split: 2023-10-24, in_sample: "1953 -> 2023-09", out_of_sample: "2023-10 -> 2026"}
  data: {available: [DGS10 (1962), GS10 (1953), GDP (vintage)], missing: []}
  caveats: ["1980s gap persistently positive, 2009-2021 negative: regime-dependent.", "Quarterly GDP noise; use 4q yoy."]

- id: C-36
  title: Deficits and Treasury supply drive long yields (lifelong rule reversed in 2023)
  topic: rates_bonds
  testability: testable
  importance: 4
  reliability: NP
  rules: [R-63]
  quotes:
  - {text: "I made a lot of money this year betting on bonds going down because of the debt and had nothing do with the economy.", source: DS/2023-11-01_cnbc-squawk-box-yellen-debt-drunken-sailors.md, date: 2023-11-01, reliability: NP}
  - {text: "In contrast, now with the economy in decline, the deficit ballooning, and the administration and the Fed in a state of panic, the public should be wary about the risk in holding long-term bonds.", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md, date: 1991-12, reliability: P}
  first_public_statement: {date: 2023-10-24, source: DS/2023-10-24_robin-hood-paul-tudor-jones.md, note: "Threw out his lifelong rule of never letting deficit concerns drive trading (S)."}
  timeline:
    held_from: {date: 2023-01, basis: stated, evidence: "2023 bond short 'because of the debt'.", source: DS/2023-11-01_cnbc-squawk-box-yellen-debt-drunken-sailors.md}
    changes:
    - {date: 1991-12, change: "Counter-evidence to the 'lifelong rule': deficit cited as long-bond risk in 1991.", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md}
    - {date: 2023-10-24, change: "Prior rule (deficits do not drive trading) abandoned.", source: DS/2023-10-24_robin-hood-paul-tudor-jones.md}
    held_until: null
    weight_history: [{from: 1981, weight: "excluded from trading (stated rule)"}, {from: 2023, weight: active}]
    dating: adequate
  statement: "Higher deficits and net Treasury supply raise the term premium on long bonds; the effect became tradeable only recently (his era split)."
  hypothesis:
    variables: {TP: "ACM 10y term premium (NEW, NY Fed, 1961 ->)", DEF: "deficit/GDP (FYFSGDA188S MISSING; Treasury MTS NEW)", ISS: "12m net marketable issuance / GDP (TFD_NET_MARKETABLE_M, 2001 ->)"}
    thresholds: [{param: deficit level, basis: interpreted, default: "> 3% of GDP at UNRATE < NROU", sensitivity: ["> 4%", "> 5%"]}]
    H1: "beta(TP on DEF, ISS) > 0 controlling for inflation and FF; H1-era: beta larger post-2008 than 1961-2007 (would explain the rule reversal)."
  test: {event: none, sample: "1961 -> 2026", frequency: Q, outcome: "regression coefficients by era; Chow test at 2008 and 2023", holds_if: "positive, significant beta in full sample", fails_if: "beta <= 0"}
  oos: {split: 2023-10-24, in_sample: "1961 -> 2023-09", out_of_sample: "2023-10 -> 2026"}
  data: {available: [TFD_NET_MARKETABLE_M (2001), FYGFDPUN (1970), GDP, UNRATE, NROU, DGS10], missing: ["ACM term premium NEW", "FYFSGDA188S MISSING (catalogue)"]}
  caveats: ["Term-premium models are estimates.", "Deficits countercyclical - control for cycle."]

- id: C-37
  title: The bond market was historically prescient; QE corrupted it; the curve is an over-rated trade
  topic: rates_bonds
  testability: testable
  importance: 3
  reliability: NP
  rules: [R-17]
  quotes:
  - {text: "Bond market used to be prescient but central-bank buying has suppressed the signal for 10-11 years.", source: RS/2022-06-10_sohn-2022-collison-conversation.md, date: 2022-06-10, reliability: S, note: "summary wording"}
  - {text: "The yield curve as a trade is over-rated.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md, date: 2026-01-30, reliability: NP, note: "note paraphrase ('over-rated')"}
  first_public_statement: {date: 2009-10-01, source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md, note: "Foreign CB buying suppresses the bond signal."}
  timeline:
    held_from: {date: 1989-Q4, basis: stated, evidence: "JGBs plummeting while Nikkei made highs (bond signal used).", source: DS/1992-XX-XX_new-market-wizards-full-chapter-text.md}
    changes:
    - {date: 2022-06-10, change: "Signal impaired ~2011-2022 by QE.", source: DS/2022-06-XX_sohn-2022-john-collison.md}
    - {date: 2023-05-09, change: "Inverted 3m/10y cited as recession sign (S).", source: DS/2023-05-09_sohn-2023-kiril-sokoloff.md}
    - {date: 2026-01-30, change: "Curve as a trade over-rated.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md}
    held_until: null
    weight_history: [{from: 1989, weight: active}, {from: 2009, weight: reduced}]
    dating: adequate
  statement: "Curve inversion predicted recessions well before QE and poorly after; curve trades themselves do not pay reliably."
  hypothesis:
    variables: {INV: "DGS10 - DGS3MO < 0 (GS10 - TB3MS pre-1981) for >= 1 month", REC: "NBER peak within 6-24m", QEERA: "2009-01 -> 2022-03", STEEP: "return of 2s10s steepener (duration-neutral) 12m after inversion"}
    thresholds: [{param: lead window, basis: interpreted, default: "6-24m", sensitivity: ["3-18m", "6-30m"]}]
    H1a: "Pre-2009 inversion hit rate high (>= 80%); post-2009 hit rate lower."
    H1b: "STEEP returns after inversion not significantly > 0."
  test: {event: inversion onsets, sample: "1934 -> 2026", frequency: M, outcome: "hit rates by era; steepener return distribution", holds_if: "H1a and H1b both hold", fails_if: "post-2009 hit rate >= pre-2009"}
  oos: {split: 2022-06-10, in_sample: "to 2022-05", out_of_sample: "2022-07 inversion episode (no recession as of 2026-09)"}
  data: {available: [DGS10, DGS3MO (1981), GS10 (1953), TB3MS (1934), DGS2 (1976), USREC], missing: []}
  caveats: ["n ~ 9 inversions; post-2009 only 2019 and 2022."]

