    thresholds: [{param: real rate state, basis: interpreted, default: "RR < 0", sensitivity: ["RR < 1%", "TG < -2pp"]}]
    H1: "E[DG | RR < 0] > E[DG | RR >= 0]; bankruptcy rate lower when RR < 0 (if data obtained)."
  test: {event: state, sample: "1955 -> 2026", frequency: Q, outcome: "conditional means, regression with cycle controls", holds_if: "DG higher by > 1pp of GDP per 8q, p < 0.10", fails_if: "<= 0"}
  oos: {split: 2014-07-16, in_sample: "1955 -> 2014-06", out_of_sample: "2014-07 -> 2026"}
  data: {available: [BCNSDODNS, GDP, FEDFUNDS, CPIAUCSL], missing: ["Business bankruptcy series: MISSING in catalogue (US Courts / ABI quarterly; free status unverified)"]}
  caveats: ["Negative real rates concentrate in 1970s (inflation) and 2009-2021: era confound.", "Bankruptcy leg untestable until a free series is located."]

