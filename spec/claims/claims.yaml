    held_until: 2022-06-10
    held_until_note: "Held as history, not as a forecast, from its first statement."
    weight_history: [{from: 2022, weight: "veto flag only"}]
    dating: thin
  statement: "Historically, US inflation above 5% only declined after the funds rate rose above the inflation rate."
  hypothesis:
    variables:
      EP: "episodes with CPI_YOY > 5%; DECLINE = CPI_YOY falls by >= half of (peak - 2%) from peak"
      COND: "FF > CPI_YOY in any month between peak-12m and the DECLINE date"
