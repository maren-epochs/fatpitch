- id: C-10
  title: Bear markets, and the biggest profits, come from central-bank mistakes
  topic: policy_error
  testability: partially_testable
  importance: 5
  reliability: NP
  rules: [R-05, R-06]
  quotes:
  - {text: "One of the things I would say is about 80 percent of the big, big money we made was in bear markets and equities because crazy things were going on in response to what I would call central bank mistakes during that 30-year period.", source: RS/2015-01-18_lost-tree-club-speech.md, date: 2015-01-18, reliability: NP}
  first_public_statement: {date: 2014-07-16, source: DS/2014-07-16_delivering-alpha-kernen.md, note: "Kernen frames 'betting against central banks'; he refers to 'all the money my firm has made in the past due to improper monetary policies'. Verbatim 80% claim 2015-01-18."}
  timeline:
    held_from: {date: 1981, basis: inferred, evidence: "'30-year period' of Duquesne (1981-2010); first cited instance the 1981 Volcker bond bet.", source: RS/2015-01-18_lost-tree-club-speech.md}
    changes:
    - {date: 2018-09-06, change: "Different metric: ~70% of money from currencies and bonds; bear-market average return > 50%.", source: RS/2018-09-06_sokoloff-real-vision-interview.md}
    held_until: null
    weight_history: [{from: 1981, weight: core}]
    dating: adequate
  statement: "US equity bear markets are preceded by identifiable monetary-policy errors (too loose for too long, or tightening into weakness)."
  hypothesis:
    variables:
      ERR: "within 36m before BEAR peak: TG < -2pp for >= 12 months (too loose) OR FF raised >= 150bp within 18m while yoy(INDPRO_FR) decelerating (too tight)"
    thresholds:
    - {param: TG loose threshold, basis: interpreted, default: -2pp, sensitivity: [-1pp, -3pp]}
    - {param: lookback, basis: interpreted, default: 36m, sensitivity: [24m, 48m]}
    H1: "Share of BEAR peaks with ERR > share of all months with ERR in the subsequent 36m window (base rate)."
    untestable_part: "Share of his own profits earned in bear markets (no free Duquesne/Quantum return series)."
  test:
    event: "BEAR peaks 1955 -> 2026 (~10)"
    sample: "1955 -> 2026"
    frequency: M
    outcome: "precondition hit rate vs base rate"
    holds_if: ">= 80% of BEAR peaks preceded by ERR and hit rate exceeds base rate by > 20pp"
    fails_if: "hit rate <= base rate"
  oos: {split: 2015-01-18, in_sample: "bears to 2009", out_of_sample: "2020, 2022 bears"}
  data:
    available: [FEDFUNDS, CPIAUCSL, UNRATE, NROU, INDPRO_FR, FF_MKT_RF_D]
    missing: ["Fund P&L by regime (untestable part)"]
  caveats: ["'Mistake' is defined by the test's TG rule, not by him; circularity risk.", "2020 bear (pandemic) has no policy-error precondition by construction."]

- id: C-11
  title: Persistently too-loose policy (Taylor-rule gap) ends in a bust with a long lag
  topic: policy_error
  testability: testable
  importance: 5
  reliability: NP
  rules: [R-06, R-11, R-48]
  quotes:
  - {text: "So, we had great conviction that the Federal Reserve was making a mistake with way too loose monetary policy.", source: RS/2015-01-18_lost-tree-club-speech.md, date: 2015-01-18, reliability: NP}
  - {text: "I just have the same horrific sense I had back in '04. And by the way, it lasted another two years.", source: RS/2015-01-18_lost-tree-club-speech.md, date: 2015-01-18, reliability: NP}
  - {text: "Simply put, this is the biggest and longest dovish deviation from historical norms I have seen in my career.", source: DS/2016-05-04_sohn-the-endgame-archived-transcript.md, date: 2016-05-04, reliability: P}
  first_public_statement: {date: 2005-05, source: DS/2016-05-04_sohn-the-endgame-archived-transcript.md, note: "Sohn 2005 Taylor-deviation housing call referenced in the 2016 prepared text; no 2005 recording located. Verified statement 2014-07-16."}
  timeline:
    held_from: {date: 2003-12, basis: stated, evidence: "Q4 2003 staff exercise: lowest guess 3%, highest 6% vs FF 1%.", source: RS/2015-01-18_lost-tree-club-speech.md}
    changes:
    - {date: 2005-05, change: "Formal Taylor-rule framing adopted (2003 exercise was 'data alone').", source: DS/2016-05-04_sohn-the-endgame-archived-transcript.md}
    - {date: 2024-10-16, change: "Restrictiveness judged from markets, 'not real-rate theory' - Taylor weight reduced in favour of FCI (C-12).", source: DS/2024-10-16_bloomberg-tv-sonali-basak.md}
    held_until: null
    weight_history: [{from: 2003, weight: core}, {from: 2024-10, weight: reduced}]
    dating: adequate
  statement: "When the policy rate stays far below a Taylor-type benchmark for a long time, an asset bubble and bust follow, typically 1.5-3 years after the alert."
  hypothesis:
    variables:
      TG: "FF - Taylor rule (R-06; real-time UNRATE_FR, NROU vintage, CPI_YOY)"
      ALERT: "first month TG < -2pp after >= 12 consecutive months TG < -1pp"
      BUST: "BEAR start or RECESSION start"
    thresholds:
    - {param: TG alert, basis: interpreted, default: -2pp, sensitivity: [-1pp, -3pp]}
    - {param: lag window, basis: stated, default: "6-36m ('lasted another two years')", sensitivity: ["12-48m"]}
    H1: "P(BUST within 6-36m | ALERT) > P(BUST within 6-36m of a random month); median lag in 12-36m."
  test:
    event: ALERT episodes
    sample: "1960 -> 2026 (NROU vintages sparse pre-2000: report real-time and current-vintage)"
    frequency: M
    outcome: "hit rate vs base rate; lag distribution"
    holds_if: "hit rate exceeds base rate by > 20pp and >= 2/3 of busts arrive in window"
    fails_if: "hit rate <= base rate"
  oos: {split: 2005-05-01, in_sample: "1960 -> 2005-04", out_of_sample: "2005-05 -> 2026 (2016-17 alert: no bust within 36m except 2020 exogenous; 2021 alert -> 2022 bear)"}
  data:
    available: [FEDFUNDS, UNRATE_FR, NROU (vintage, sparse), CPIAUCSL, GDPPOT, FF_MKT_RF_D, USREC]
    missing: ["CPILFESL MISSING (core variant)"]
  caveats: ["Taylor coefficients and r* chosen ex post; use registry defaults only.", "Long-lag claims are hard to falsify (any later bust 'confirms').", "Overlapping episodes 2009-2021 nearly continuous."]
- id: C-12
  title: Markets (financial conditions) gauge restrictiveness better than real-rate theory
  topic: policy_error
  testability: testable
  importance: 4
  reliability: NP
  rules: [R-58, R-06]
  quotes:
  - {text: "I don't really go buy theory. I'm a market animal. Frankly, we've found over the years that markets are better predictors than professors.", source: DS/2024-10-16_bloomberg-tv-sonali-basak.md, date: 2024-10-16, reliability: NP}
  - {text: "Once financial conditions took off, it became very clear that this thing could go either way. So I exited the position.", source: DS/2024-05-07_cnbc-squawk-box-forward-guidance-ai-argentina.md, date: 2024-05-07, reliability: NP}
  first_public_statement: {date: 2019-06-03, source: DS/2019-06-03_econclub-ny-bessent.md, note: "'sneak one in every time financial conditions allowed' (S). Verbatim principle 2024-10-16."}
  timeline:
    held_from: {date: 2019-06-03, basis: inferred, evidence: "ECNY 2019; 'over the years' (2024) is undated.", source: DS/2019-06-03_econclub-ny-bessent.md}
    changes: [{date: 2024-10-16, change: "Explicitly preferred over real-rate theory.", source: DS/2024-10-16_bloomberg-tv-sonali-basak.md}]
    held_until: null
    weight_history: [{from: 2019, weight: active}, {from: 2024, weight: core}]
    dating: thin
  statement: "Financial-conditions indices predict subsequent growth and inflation better than real-rate or Taylor-gap measures of policy stance."
  hypothesis:
    variables:
      NFCI: "NFCI (vintage), level and 13w change"
      RRG: "FF - CPI_YOY - r* (registry policy.taylor_rstar_pct); TG sensitivity"
      Y: "next-12m change in yoy(INDPRO_FR) and next-12m change in CPI_YOY"
    thresholds: [{param: horizon, basis: interpreted, default: 12m, sensitivity: [6m, 18m]}]
    H1: "Out-of-sample R2 (expanding window, start 1985) of NFCI model > RRG model for both targets."
  test: {event: none, sample: "1971-01 -> 2026-09", frequency: M, outcome: "OOS R2 difference, Clark-West test", holds_if: "NFCI beats RRG for growth and inflation, p < 0.10", fails_if: "RRG beats NFCI on both"}
  oos: {split: 2019-06-03, in_sample: "1971 -> 2019-05", out_of_sample: "2019-06 -> 2026"}
  data: {available: [NFCI (1971, vintage), FEDFUNDS, CPIAUCSL, INDPRO_FR, UNRATE_FR, NROU], missing: []}
  caveats: ["NFCI is revised and partly constructed ex post; real-time vintages only from ALFRED coverage.", "Claim may refer to asset prices broadly (equities, gold, crypto, spreads), not NFCI specifically."]

