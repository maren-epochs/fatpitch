  timeline: {held_from: {date: 2018-09-06, basis: stated, evidence: "Real Vision 2018.", source: RS/2018-09-06_sokoloff-real-vision-interview.md}, changes: [], held_until: null, weight_history: [{from: 2018, weight: minor}], dating: thin}
  statement: "The variable that best explains G10 currency moves shifts from current accounts (to ~1990s) to interest differentials (to ~2008) to risk sentiment."
