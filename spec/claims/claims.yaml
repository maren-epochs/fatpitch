- id: C-56
  title: Contrarianism is overrated; the crowd is right 80% of the time
  topic: positioning
  testability: testable
  importance: 3
  reliability: NP
  rules: [R-31, R-37]
  quotes:
  - {text: "Contrarian investing is way overrated... the crowd makes money 80% of the time.", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md, date: 2009-Q4, reliability: NP}
  - {text: "I think contrarianism is overrated. Soros used to say the crowd's right 80% of the time.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md, date: 2026-01-30, reliability: NP}
  first_public_statement: {date: 2009-10-01, source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}
  timeline: {held_from: {date: 1988, basis: inferred, evidence: "Attributed to Soros (joined 1988).", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md}, changes: [{date: 2026-01-30, change: "Crowding matters for entry points, not thesis validity.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md}], held_until: null, weight_history: [{from: 1988, weight: core}], dating: adequate}
  statement: "Following speculative positioning (the crowd) is profitable most of the time; fading it is not."
  hypothesis:
    variables: {POS: "sign of COT non-commercial net % of OI (COT_*)", TS: "sensitivity: sign of 12m price trend", R: "forward 4w and 13w return"}
    thresholds: [{param: hit rate, basis: stated, default: 0.80, sensitivity: []}, {param: horizon, basis: interpreted, default: 13w, sensitivity: [4w, 26w]}]
    H1a: "Hit rate of sign(POS) for sign(R) > 0.5 (crowd better than contrarian)."
    H1b: "Hit rate near 0.8 (literal claim)."
  test: {event: none, sample: "1986 -> 2026", frequency: W, outcome: "pooled hit rate by market; extremes-only subset (top/bottom decile POS)", holds_if: "H1a holds and extremes subset not reversed", fails_if: "hit rate <= 0.5 or extremes show reversal"}
  oos: {split: 2009-10-01, in_sample: "1986 -> 2009-09", out_of_sample: "2009-10 -> 2026"}
  data: {available: [COT_* (1986 ->, release_calendar), FX/futures price series in catalogue], missing: ["continuous futures returns pre-2017 (spot proxies used)"]}
  caveats: ["'80%' is a saying; a literal 80% hit rate is near-impossible; H1a is the operative test.", "'Crowd' undefined: COT is one proxy."]

