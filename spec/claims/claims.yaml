  timeline: {held_from: {date: 2022-09-28, basis: stated, evidence: "DA 2022, 1970s analogy.", source: DS/2022-09-28_delivering-alpha-kernen-transcript.md}, changes: [], held_until: null, weight_history: [{from: 2022, weight: active}], dating: thin}
  statement: "After CPI inflation exceeds ~5%, wage growth accelerates with a lag and stays elevated after CPI peaks."
  hypothesis:
    variables: {W: "yoy(AHETPI) (NEW, 1964 ->)", EP: "CPI_YOY crossing above 5%"}
    thresholds: [{param: threshold, basis: interpreted, default: 5%, sensitivity: [4%, 6%]}]
    H1: "Within 18m of EP, W rises >= 1pp and W peak lags CPI peak by > 0 months."
  test: {event: EP crossings, sample: "1964 -> 2026", frequency: M, outcome: "lag of wage peak vs CPI peak; hit count", holds_if: "all episodes show positive lag and >= 1pp acceleration", fails_if: "majority show none"}
  oos: {split: 2022-09-28, in_sample: "1964 -> 2022-08", out_of_sample: "2022-09 -> 2026"}
  data: {available: [CPIAUCSL], missing: ["AHETPI / ECI NEW (FRED)"]}
  caveats: ["n ~ 5 episodes; composition effects in 2020."]

- id: C-18
  title: Deflations follow asset bubbles, not the zero bound
  topic: bubbles_fragility
  testability: testable
  importance: 3
  reliability: NP
  rules: [R-11]
  quotes:
  - {text: "We have never had deflation that I can find that started because we were near the zero bound; we have deflation in every instance because there was an asset bubble.", source: DS/2019-06-07_cnbc-squawk-box-one-way-bet.md, date: 2019-06-07, reliability: NP}
  - {text: "So, the fed keeps talking about deflation, but there is nothing more deflationary than creating a phony asset bubble, having a bunch of investors plow into it and then having it pop.", source: RS/2015-01-18_lost-tree-club-speech.md, date: 2015-01-18, reliability: NP}
  first_public_statement: {date: 2015-01-18, source: RS/2015-01-18_lost-tree-club-speech.md}
  timeline:
    held_from: {date: 2005-06, basis: inferred, evidence: "Lost Tree: late 2003 expected inflation; by mid-2005 'figured out ... this is going to end in deflation'.", source: RS/2015-01-18_lost-tree-club-speech.md}
    changes: [{date: 2022-06-10, change: "Restated: deflation has followed every asset bubble (S).", source: RS/2022-06-10_sohn-2022-collison-conversation.md}]
    held_until: null
    weight_history: [{from: 2005, weight: active}]
    dating: adequate
  statement: "Every deflation episode was preceded by an asset bubble; none began merely because rates were near zero."
  hypothesis:
    variables:
      DEFL: "start of CPI yoy < 0 lasting >= 6 months (US CPIAUCNS 1914 ->; Shiller CPI 1871 ->; JST 17 countries 1870 -> annual)"
      BUB: "real equity or house price > 1.5 sd above 10y log-trend, or >= 100% real rise over 5y, within 60m before DEFL"
      ZLB: "short rate < 1% at DEFL start"
    thresholds: [{param: bubble definition, basis: interpreted, default: "1.5 sd above trend", sensitivity: ["1.0 sd", "2.0 sd", "100% 5y rise"]}]
    H1: "P(BUB | DEFL) > P(BUB) unconditional; no DEFL with ZLB and without BUB."
  test: {event: DEFL starts, sample: "1871 -> 2026 (US); JST panel 1870 -> 2020", frequency: "M (US), A (JST)", outcome: "share with prior bubble vs base rate; counterexamples", holds_if: "share with BUB >= 80% and > base rate by 30pp", fails_if: "share near base rate"}
  oos: {split: 2015-01-18, in_sample: "to 2014", out_of_sample: "2015 -> 2026 (euro area 2015, Japan episodes)"}
  data: {available: [CPIAUCNS, SHILLER_SP], missing: ["Shiller CPI field and JST Macrohistory NEW (JST licence CC BY-NC-SA)", "House prices pre-1975 via JST only"]}
  caveats: ["19th-century deflations under the gold standard are structural, not post-bubble.", "Bubble definition is the decisive choice; pre-register before running."]
- id: C-19
  title: Severe economic outcomes follow asset bubbles
  topic: bubbles_fragility
  testability: testable
  importance: 3
  reliability: NP
  rules: [R-11, R-61]
  quotes:
  - {text: "I have never seen... a really bad economic outcome... without an asset bubble.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md, date: 2026-01-30, reliability: NP}
  - {text: "The worst economic outcomes tend to follow asset bubbles.", source: DS/2023-05-09_sohn-2023-kiril-sokoloff.md, date: 2023-05-09, reliability: S}
  first_public_statement: {date: 2023-05-09, source: DS/2023-05-09_sohn-2023-kiril-sokoloff.md}
  timeline: {held_from: {date: 2015-01-18, basis: inferred, evidence: "Lost Tree link of bubble pop to deflationary event.", source: RS/2015-01-18_lost-tree-club-speech.md}, changes: [], held_until: null, weight_history: [{from: 2015, weight: active}], dating: adequate}
  statement: "Recessions that are deep (top-tercile output loss) are preceded by asset bubbles; mild recessions need not be."
  hypothesis:
    variables: {SEV: "recession with peak-to-trough decline in INDPRO (or real GDP, JST) in top tercile", BUB: "C-18 bubble definition within 36m before NBER peak"}
    thresholds: [{param: severity tercile, basis: interpreted, default: top tercile, sensitivity: [top half, top quartile]}]
    H1: "P(BUB | SEV) > P(BUB | non-severe recession); zero SEV without BUB."
  test: {event: NBER recessions 1871 -> 2020 (US); JST panel, sample: "1871 -> 2026", frequency: "M/A", outcome: "2x2 table, Fisher test, counterexamples", holds_if: "P(BUB|SEV) - P(BUB|mild) > 30pp", fails_if: "<= 0"}
  oos: {split: 2023-05-09, in_sample: "to 2023-04", out_of_sample: "recessions dated after 2023-05 (none as of 2026-09)"}
  data: {available: [INDPRO (1919), SHILLER_SP, USREC, NBER_CYCLES], missing: ["JST NEW", "Shiller CPI NEW"]}
  caveats: ["War/pandemic recessions (1945, 2020) need a pre-registered exclusion rule.", "Small n."]

- id: C-20
  title: A bubble becomes systemic only when excess enters the banking system
  topic: bubbles_fragility
  testability: testable
  importance: 3
  reliability: NP
  rules: [R-11]
  quotes:
  - {text: "While the Fed thought the crisis was containable, we thought no such thing because when the bad stuff gets into the banking system itself, it has huge, wider implications for the broader economy.", source: DS/2014-07-16_delivering-alpha-kernen.md, date: 2014-07-16, reliability: NP}
  first_public_statement: {date: 2014-07-16, source: DS/2014-07-16_delivering-alpha-kernen.md}
  timeline: {held_from: {date: 2005-06, basis: stated, evidence: "DA 2014 retrospective on 2005-06 double leverage via shadow banking.", source: DS/2014-07-16_delivering-alpha-kernen.md}, changes: [{date: 2023-06-07, change: "Regional-bank CRE exposure named as transmission channel.", source: DS/2023-06-07_bloomberg-invest-sonali-basak.md}], held_until: null, weight_history: [{from: 2005, weight: active}], dating: adequate}
  statement: "Asset-price busts preceded by a bank-credit boom produce deeper recessions than busts without one."
  hypothesis:
    variables: {BUST: "real equity or house price fall >= 25% (JST/US)", BOOM: "bank credit/GDP gap > 2pp (BIS gap, or JST loans/GDP 5y change > 1 sd) at bust start", Y: "cumulative real GDP loss over 3y after bust"}
    thresholds: [{param: credit gap, basis: interpreted, default: 2pp, sensitivity: [0pp, 4pp, 10pp]}]
    H1: "E[Y | BUST and BOOM] worse than E[Y | BUST and not BOOM]."
  test: {event: BUST episodes, sample: "JST 1870 -> 2020; US quarterly 1952 ->", frequency: "A/Q", outcome: "difference in mean output loss; local projections", holds_if: "difference > 2pp of GDP, p < 0.10", fails_if: "<= 0"}
  oos: {split: 2014-07-16, in_sample: "to 2013", out_of_sample: "2014 -> 2026 (2020 bust, 2022 bust)"}
  data: {available: [BCNSDODNS (1945), GDP], missing: ["BIS credit gap NEW", "JST NEW", "US bank credit TOTBKCR NEW (1973, id per data_practices)"]}
  caveats: ["Literature (Jorda-Schularick-Taylor) already supports a version; risk of confirming a known result rather than his specific claim."]

- id: C-21
  title: Bear markets that follow asset bubbles last longer than six months
  topic: bubbles_fragility
  testability: testable
  importance: 4
  reliability: NP
  rules: [R-61]
  quotes:
  - {text: "Six months bear markets preceded by asset bubbles don't exist, historically.", source: DS/2022-06-XX_sohn-2022-john-collison.md, date: 2022-06, reliability: NP}
  first_public_statement: {date: 2022-06-10, source: DS/2022-06-XX_sohn-2022-john-collison.md}
  timeline: {held_from: {date: 2022-06-10, basis: stated, evidence: "Sohn 2022.", source: DS/2022-06-XX_sohn-2022-john-collison.md}, changes: [], held_until: null, weight_history: [{from: 2022, weight: active}], dating: thin, dating_note: "2000-02 experience implies earlier awareness; not dated."}
  statement: "When a bear market follows a bubble, peak-to-trough lasts more than six months."
  hypothesis:
    variables: {BEAR: "EQ_US and NASDAQCOM declines >= 20%", BUB: "C-18 bubble definition on the same index within 24m before peak, or fragility_level high (R-11)", DUR: "months peak to trough"}
    thresholds: [{param: duration, basis: stated, default: 6m, sensitivity: []}, {param: bubble definition, basis: interpreted, default: "1.5 sd above trend", sensitivity: ["1.0 sd", "2.0 sd"]}]
    H1: "No BEAR with BUB has DUR <= 6m."
  test: {event: BEAR list, sample: "1871 -> 2026 (monthly Shiller), 1926 -> (daily French), 1971 -> (NASDAQ)", frequency: D/M, outcome: "counterexample count; DUR distribution BUB vs non-BUB", holds_if: "zero counterexamples", fails_if: ">= 1 counterexample"}
  oos: {split: 2022-06-10, in_sample: "to 2021", out_of_sample: "2022 bear (peak 2022-01, trough 2022-10: >6m) and later"}
  data: {available: [SHILLER_SP, FF_MKT_RF_D, NASDAQCOM], missing: []}
  caveats: ["1987 crash (~3m) and 2020 (~1m) are the decisive cases: was there a 'bubble'? Pre-register the bubble rule.", "Monthly averages (Shiller) shorten measured declines."]

- id: C-22
  title: 80%+ unprofitable IPOs occur only at bubble peaks
  topic: bubbles_fragility
  testability: testable
  importance: 3
  reliability: NP
  rules: [R-11]
  quotes:
  - {text: "If you look at IPOs, 80 percent of them are unprofitable when they come. The only other time we've been at 80 percent or higher was 1999.", source: RS/2015-01-18_lost-tree-club-speech.md, date: 2015-01-18, reliability: NP}
  first_public_statement: {date: 2014-07-16, source: DS/2014-07-16_delivering-alpha-kernen.md, note: "'In 99, 83 percent ... Today that's 80 percent.'"}
  timeline: {held_from: {date: 2014-07-16, basis: stated, evidence: "DA 2014.", source: DS/2014-07-16_delivering-alpha-kernen.md}, changes: [], held_until: null, weight_history: [{from: 2014, weight: "alert, non-gating"}], dating: adequate}
  statement: "A share of unprofitable IPOs at or above 80% marks speculative excess that precedes a major decline."
  hypothesis:
    variables: {U: "RITTER_UNPROF_IPO annual share", DD: "max EQ_US / NASDAQCOM drawdown within 36m after year-end"}
    thresholds: [{param: share threshold, basis: stated, default: 80%, sensitivity: [70%, 75%]}, {param: drawdown, basis: interpreted, default: 20%, sensitivity: [15%, 30%]}]
    H1: "Years with U >= 80% (in-sample: only 1999/2000 per his claim) are followed by DD >= 20% within 36m more often than other years."
  test: {event: "years with U >= threshold", sample: "1980 -> 2025", frequency: A, outcome: "list of qualifying years; conditional drawdown frequency", holds_if: "qualifying years limited to bubble years and followed by DD in all cases", fails_if: "qualifying years without later DD or high-U years not flagged"}
  oos: {split: 2015-01-18, in_sample: "1980 -> 2014", out_of_sample: "2015 -> 2025 (check 2020-2021 shares; outcome not presumed)"}
  data: {available: [RITTER_UNPROF_IPO (1980, annual, publication-lag rule), FF_MKT_RF_D, NASDAQCOM], missing: []}
  caveats: ["Annual data, n ~ 45; 2014 signal lasted 'another two years' before a ~14% drawdown, not 20%.", "Ritter definition (negative EPS trailing 12m) and sample filters revised over time."]

- id: C-23
  title: Credit-excess indicators are alerts with a long lead, not timing signals
  topic: bubbles_fragility
  testability: partially_testable
  importance: 3
  reliability: NP
  rules: [R-11, R-48]
  quotes:
  - {text: "Today 71 percent of the debt that's been issued in the last two years is B rated.", source: RS/2015-01-18_lost-tree-club-speech.md, date: 2015-01-18, reliability: NP}
  - {text: "I think the risk of a credit bubble is extremely high.", source: DS/2015-04-15_bloomberg-tv-stephanie-ruhle.md, date: 2015-04-15, reliability: NP}
  first_public_statement: {date: 2014-07-16, source: DS/2014-07-16_delivering-alpha-kernen.md}
  timeline:
    held_from: {date: 1988-03, basis: inferred, evidence: "Barron's 1988 'buyout craze' segment (teaser only).", source: DS/1988-03-28_barrons-still-bearish.md}
    changes: [{date: 2015-01-18, change: "Explicitly 'not timing': 'it lasted another two years'.", source: RS/2015-01-18_lost-tree-club-speech.md}]
    held_until: null
    weight_history: [{from: 2004, weight: "alert"}, {from: 2014, weight: "alert, non-gating"}]
    dating: thin
    dating_note: "1988 evidence is a headline only; first substantive dated use 2004-05."
  statement: "High corporate leverage growth and low credit quality raise the probability of a credit-driven bust within roughly 1-3 years but do not time it."
  hypothesis:
    variables: {CG: "8q change in BCNSDODNS/GDP", HY: "SIFMA_HY_SHARE_A", OAS: "BAMLH0A0HYM2 (inverted)", EV: "HY default wave proxy: BAA-AAA widening >= 100bp or BEAR"}
    thresholds: [{param: alert percentile, basis: interpreted, default: 80th expanding, sensitivity: [70th, 90th]}, {param: lead window, basis: stated, default: "12-36m", sensitivity: ["6-48m"]}]
    H1: "P(EV within 12-36m | alert) > base rate, while P(EV within 0-6m | alert) is not above base rate."
  test: {event: alert months, sample: "1952 -> 2026 (CG); 1996 -> (HY share, OAS)", frequency: Q, outcome: "hit rate by lead bucket", holds_if: "excess hit rate concentrated in 12-36m bucket", fails_if: "no excess at any lead or excess only at 0-6m"}
  oos: {split: 2014-07-16, in_sample: "to 2014-06", out_of_sample: "2014-07 -> 2026"}
  data: {available: [BCNSDODNS (1945), GDP, SIFMA_HY_SHARE_A (1996), BAMLH0A0HYM2 (1996; FRED keeps 3y from 2026-04 - capture), BAA, AAA], missing: ["B-rated issuance share and covenant-lite share: MISSING (no free history)"]}
  caveats: ["His two strongest gauges (B share, cov-lite) cannot be tested.", "Long variable lead means any later event confirms; pre-registered window required."]

- id: C-24
  title: Zero or negative real rates swell corporate debt and suppress bankruptcies (zombies)
  topic: bubbles_fragility
  testability: partially_testable
  importance: 3
  reliability: NP
  rules: [R-11, R-06]
  quotes:
  - {text: "If rates stay at zero, the debt is going to explode. When do you ever pull the trigger?", source: DS/2014-07-16_delivering-alpha-kernen.md, date: 2014-07-16, reliability: NP}
  - {text: "If that rate is not up there somewhere around three or four, people are going to get crazy… Zombies are going to stay in business.", source: DS/2019-06-07_cnbc-squawk-box-one-way-bet.md, date: 2019-06-07, reliability: NP}
  first_public_statement: {date: 2014-07-16, source: DS/2014-07-16_delivering-alpha-kernen.md}
