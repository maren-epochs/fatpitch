- id: C-14
  title: No soft landing after inflation has exceeded 4.5%
  topic: inflation
  testability: testable
  importance: 5
  reliability: S
  rules: [R-07]
  quotes:
  - {text: "We've never had a soft landing after inflation has got above 4.5%.", source: RS/2022-06-10_sohn-2022-collison-conversation.md, date: 2022-06-10, reliability: S}
  first_public_statement: {date: 2022-06-10, source: RS/2022-06-10_sohn-2022-collison-conversation.md, note: "Recording late May/early June 2022; YouTube published 2022-06-10."}
  timeline:
    held_from: {date: 2022-06-10, basis: stated, evidence: "Sohn 2022; 'only 2-3 soft landings in history (1994-95)'.", source: RS/2022-06-10_sohn-2022-collison-conversation.md}
    changes: [{date: 2024-11-06, change: "Conceded the 2023 hard-landing call was 'completely wrong'; rule not restated.", source: RS/2024-11-06_nbim-in-good-company-podcast.md}]
    held_until: null
    weight_history: [{from: 2022, weight: core}, {from: 2024, weight: unknown}]
    dating: thin
    dating_note: "Retrospective 'never' implies a long-held historical reading; no earlier dated statement."
  statement: "Once CPI inflation exceeds 4.5%, the subsequent Fed tightening cycle ends in recession."
  hypothesis:
    variables:
      EP: "tightening cycles (C-04 onset to last hike) during which or within 12m before which CPI_YOY > 4.5%"
      SOFT: "no RECESSION within 24m after the last hike of the cycle"
    thresholds:
    - {param: inflation threshold, basis: stated, default: 4.5%, sensitivity: [4.0%, 5.0%]}
    - {param: landing window, basis: interpreted, default: 24m, sensitivity: [18m, 36m]}
    H1: "Count of EP with SOFT = 0 (no counterexample)."
  test: {event: EP list, sample: "1914 -> 2026 (CPIAUCNS; FF stand-in pre-1954)", frequency: M, outcome: "counterexample count; soft-landing rate vs cycles with CPI <= 4.5%", holds_if: "zero counterexamples in-sample", fails_if: ">= 1 counterexample in-sample; OOS: 2022-23 cycle soft landing counts against"}
  oos: {split: 2022-06-10, in_sample: "cycles to 2021", out_of_sample: "2022-2023 cycle (CPI 9.1%; no NBER recession as of 2026-09 per USREC)"}
  data: {available: [CPIAUCSL (1947), CPIAUCNS (1913), FEDFUNDS (1954), USREC, NBER_CYCLES], missing: ["pre-1954 policy rate NEW"]}
  caveats: ["n of qualifying cycles ~8; 'soft landing' definition chosen here.", "NBER labels announced with 5-21m lag (outcome-side use only).", "OOS outcome as of 2026-09: CPI peak 9.1% (2022-06) with no NBER recession - a counterexample unless a recession is later dated within the window."]

- id: C-15
  title: Inflation above 5% has not fallen without fed funds above CPI
  topic: inflation
  testability: testable
  importance: 5
  reliability: NP
  rules: [R-08]
  quotes:
