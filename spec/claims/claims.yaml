  topic: internals_breadth
  testability: testable
  importance: 4
  reliability: NP
  rules: [R-20, R-21]
  quotes:
  - {text: "He taught me that you have to visualize the situation 18 months from now, and whatever that is, that's where the price will be, not where it is today.", source: RS/2015-01-18_lost-tree-club-speech.md, date: 2015-01-18, reliability: NP}
  - {text: "Always try and envision the situation as you see it in 18 to 24 months, and then see if you feel things will be differently than they are now.", source: RS/2024-11-06_nbim-in-good-company-podcast.md, date: 2024-11-06, reliability: NP}
  first_public_statement: {date: 2015-01-18, source: RS/2015-01-18_lost-tree-club-speech.md}
  timeline:
    held_from: {date: 1977, basis: stated, evidence: "Drelles lesson.", source: RS/2015-01-18_lost-tree-club-speech.md}
    changes:
    - {date: 2015-04-15, change: "'6 to 12 months down the road'.", source: DS/2015-04-15_bloomberg-tv-stephanie-ruhle.md}
    - {date: 2022-06-10, change: "12-18 months (S summary).", source: RS/2022-06-10_sohn-2022-collison-conversation.md}
    - {date: 2023-04-24, change: "'higher in a year or two'.", source: DS/2023-04-24_nbim-annual-investment-conference.md}
    - {date: 2024-11-06, change: "18-24 months; 2-4 year trends.", source: RS/2024-11-06_nbim-in-good-company-podcast.md}
    - {date: 2026-01-30, change: "18 months to 3 years.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md}
    held_until: null
    weight_history: [{from: 1977, weight: core, note: "horizon 18m"}, {from: 2024, weight: core, note: "horizon 18-36m"}]
    dating: adequate
  statement: "Current prices correlate more with fundamentals ~18 months ahead than with current fundamentals."
  hypothesis:
    variables: {P: "log real EQ_US detrended", E: "log real Shiller earnings detrended (and INDPRO)", k: "lead in months 0..36"}
    thresholds: [{param: lead, basis: stated, default: 18m, sensitivity: [6m, 12m, 24m, 36m]}]
    H1: "corr(P_t, E_t+18) > corr(P_t, E_t); argmax_k within 12-24m."
  test: {event: none, sample: "1871 -> 2026", frequency: M, outcome: "lead profile of correlations with CI", holds_if: "corr at 18m exceeds corr at 0m, CI-separated", fails_if: "contemporaneous corr highest"}
  oos: {split: 2015-01-18, in_sample: "to 2014", out_of_sample: "2015 -> 2026"}
  data: {available: [SHILLER_SP, INDPRO], missing: ["Shiller earnings/CPI fields NEW"]}
  caveats: ["Overlaps C-27 (6-12m); the horizon shift over time is the point of the timeline.", "Shiller earnings interpolated monthly."]

- id: C-29
  title: Leading industries turn before the economy; defensives over cyclicals signals late cycle
  topic: internals_breadth
  testability: partially_testable
  importance: 4
  reliability: NP
  rules: [R-16, R-15]
  quotes:
  - {text: "They're predicting we're in a very, very late cycle", source: DS/2018-11-21_wsj-interview-risky-to-be-tightening.md, date: 2018-11-21, reliability: S}
  - {text: "Stocks tend to lead the fundamentals by somewhere between 6 and 12 months.", source: DS/2022-06-XX_sohn-2022-john-collison.md, date: 2022-06, reliability: NP}
  first_public_statement: {date: 2018-09-06, source: RS/2018-09-06_sokoloff-real-vision-interview.md, note: "Career-long use of internal groups; specific industries named 2018-11 to 2023-05."}
  timeline:
    held_from: {date: 1983, basis: inferred, evidence: "Real Vision 2018: price/relative-strength signals used for 35 years.", source: RS/2018-09-06_sokoloff-real-vision-interview.md}
    changes:
    - {date: 2018-09-06, change: "Algos cancelled relative-strength signals (pharma example).", source: RS/2018-09-06_sokoloff-real-vision-interview.md}
    - {date: 2023-05-09, change: "Trucking lead 6-8 months (S).", source: DS/2023-05-09_sohn-2023-kiril-sokoloff.md}
    - {date: 2026-01-30, change: "Internals and company mosaics remain main macro inputs.", source: DS/2026-02-27_morgan-stanley-hard-lessons-bouzali.md}
    held_until: null
    weight_history: [{from: 1983, weight: core}, {from: 2018, weight: active, note: "signal quality questioned"}]
    dating: thin
  statement: "Relative weakness in homebuilders, transports, retail, banks, metals and small caps (and defensives outperforming cyclicals) precedes economic downturns by 6-12 months."
  hypothesis:
    variables: {LRS: "median 6m relative return of leading set (process.md R-16 mapping) vs market", DEF: "6m return (Utils+NoDur+Hlth) minus (Durbl+Manuf+Money+Shops)", REC: "NBER peak within 12m"}
    thresholds: [{param: weakness, basis: interpreted, default: "LRS < -10% (6m)", sensitivity: ["-5%", "-15%"]}, {param: lead window, basis: stated, default: "6-12m", sensitivity: ["3-18m"]}]
    H1: "P(REC peak within 6-12m | LRS signal) > base rate; false-alarm rate reported."
  test: {event: signal onsets, sample: "1926 -> 2026 (French 12 substitute)", frequency: M, outcome: "hit and false-alarm rates; lead distribution", holds_if: "hit rate exceeds base by > 25pp", fails_if: "no excess"}
  oos: {split: 2018-11-21, in_sample: "to 2018-10", out_of_sample: "2018-11 -> 2026 (2018-19 and 2022-23 signals without recession are OOS evidence)"}
  data: {available: [FRENCH12_* (substitute grade), ETF_XHB/IYT/XRT/KBE/XME/IWM (2021-09 ->)], missing: ["FRENCH49 MISSING (homebuilding, trucking, retail, steel not separable in French 12)"]}
  caveats: ["French 12 mapping is coarse; claim partially testable until French 49 loads.", "Signals 2019 and 2022-23 fired with no recession."]

- id: C-30
  title: Momentum bottoms 12-18 months before fundamentals
  topic: internals_breadth
  testability: testable
  importance: 3
  reliability: NP
  rules: [R-18]
  quotes:
  - {text: "The momentum tools bottom 12-18 months before fundamentals.", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md, date: 2009-Q4, reliability: NP, note: "Note summary wording, not a verbatim sentence."}
  first_public_statement: {date: 2009-10-01, source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}
  timeline: {held_from: {date: 2009-10-01, basis: stated, evidence: "Feig 2009 (272 charts, second-derivative RoC).", source: DS/2009-XX-XX_citi-fxlm-fireside-jeff-feig.md}, changes: [{date: 2023-04-24, change: "RoC charts used for idea generation and as bias check.", source: DS/2023-04-24_nbim-annual-investment-conference.md}], held_until: null, weight_history: [{from: 2009, weight: active}], dating: thin}
  statement: "Second-derivative price momentum troughs 12-18 months before earnings/activity trough."
  hypothesis:
    variables: {MB: "month where 6m change of 12m ROC of EQ_US turns positive while 12m ROC < 0 (R-18)", FT: "trough of yoy Shiller earnings / INDPRO"}
    thresholds: [{param: lead, basis: stated, default: "12-18m", sensitivity: ["6-24m"]}, {param: ROC windows, basis: interpreted, default: "12m / 6m", sensitivity: ["6m/3m", "24m/6m"]}]
    H1: "Median lead MB -> FT within 12-18m; distinct from C-27's 6-12m."
  test: {event: fundamental troughs, sample: "1871 -> 2026", frequency: M, outcome: "lead distribution; spurious-MB rate", holds_if: "median lead in 12-18m with IQR overlapping", fails_if: "median lead < 6m"}
  oos: {split: 2009-10-01, in_sample: "to 2009-09", out_of_sample: "2009-10 -> 2026"}
  data: {available: [SHILLER_SP, INDPRO, FF_MKT_RF_D], missing: ["Shiller earnings NEW"]}
  caveats: ["Many MB events without a fundamental trough; matching rule must be pre-registered (nearest subsequent trough within 36m)."]

- id: C-31
  title: A stock-market explosion on record breadth and volume signals exit from recession within 6-12 months
  topic: internals_breadth
  testability: testable
  importance: 4
  reliability: NP
  rules: [R-60]
  quotes:
  - {text: "Whenever I've seen a stock market explode on record volume and record breadth… 6 to 12 months down the road, you're out of recession.", source: DS/2015-04-15_bloomberg-tv-stephanie-ruhle.md, date: 2015-04-15, reliability: NP}
  first_public_statement: {date: 2015-04-15, source: DS/2015-04-15_bloomberg-tv-stephanie-ruhle.md}
  timeline: {held_from: {date: 2015-04-15, basis: stated, evidence: "'Whenever I've seen' implies career-long observation; undated.", source: DS/2015-04-15_bloomberg-tv-stephanie-ruhle.md}, changes: [{date: 2015-04-15, change: "Applied to China; confidence cut to ~70%; failed.", source: DS/2015-04-15_bloomberg-tv-stephanie-ruhle.md}, {date: 2020-06-08, change: "Breadth thrust reversed his bearish call.", source: DS/2020-06-08_cnbc-squawk-box-humbled-underestimated-fed.md}], held_until: null, weight_history: [{from: 2015, weight: active}, {from: 2020, weight: core, note: "overrides net-liquidity read"}], dating: thin}
  statement: "Breadth thrusts during weak activity are followed within 6-12 months by economic recovery (no recession or recession ended)."
  hypothesis:
    variables: {BT: "Zweig thrust: 10d EMA of adv/(adv+dec) from < 0.40 to > 0.615 within 10 days (ZWEIG_EMA10)", UPV: "sensitivity: 10d up-volume share > 0.77", OUT: "USREC = 0 at t+12m, and if USREC = 1 at t, recession ends within 12m"}
    thresholds: [{param: thrust definition, basis: interpreted, default: Zweig 0.40/0.615, sensitivity: ["up-volume 90% days", "pct-above-50dma thrust"]}, {param: horizon, basis: stated, default: "6-12m", sensitivity: []}]
    H1: "P(OUT | BT) > P(OUT) base rate; forward 12m EQ_US return after BT > unconditional."
  test: {event: BT dates, sample: "1965-03 -> 2020-02 (NYSE); 2021-09 -> (S&P members); gap fallback flagged", frequency: D, outcome: "hit rate; conditional returns", holds_if: "OUT in >= 90% of BT and returns above unconditional", fails_if: "OUT rate <= base rate"}
  oos: {split: 2015-04-15, in_sample: "1965 -> 2015-03", out_of_sample: "2015-04 -> 2026 (US only; China 2015 out of scope by rule)"}
  data: {available: [NYSE_ADV, NYSE_DEC, NYSE_UPVOL, NYSE_DNVOL (1965-03 -> 2020-02-10), ZWEIG_EMA10, SPX_PCT_ADV (2021-09), USREC], missing: ["2020-02-11 -> 2021-09-21 breadth gap (French industry fallback)"]}
  caveats: ["Base rate of 'no recession in 12m' is ~85%: test must use the conditional-on-weakness subset (thrust while INDPRO yoy < 0) for power.", "'Record' volume/breadth not operationalized by him."]

- id: C-32
  title: No bear market starts without leadership narrowing
  topic: internals_breadth
  testability: testable
  importance: 4
  reliability: NP
  rules: [R-59]
  quotes:
  - {text: "We've never had a bear market start without the leadership narrowing... it's a yellow light, it's not a red light.", source: RS/2024-11-06_nbim-in-good-company-podcast.md, date: 2024-11-06, reliability: NP}
  first_public_statement: {date: 2024-11-06, source: RS/2024-11-06_nbim-in-good-company-podcast.md}
  timeline: {held_from: {date: 2000-01, basis: inferred, evidence: "1999-2000 breadth divergence (13 new highs vs 242 new lows) cited in secondary accounts.", source: DS/2000-04-28_soros-quantum-exit-overplayed-hand.md}, changes: [], held_until: null, weight_history: [{from: 2024, weight: "necessary condition, non-gating"}], dating: thin}
  statement: "Every bear market is preceded by narrowing participation while the index is near highs; narrowing alone does not imply a bear market."
  hypothesis:
    variables: {NAR: "share of industries above 40w trend falls >= 20pts over 6m while EQ_US within 5% of high (R-59 params)", BEAR: "EQ_US >= 20% decline"}
    thresholds: [{param: narrowing drop, basis: interpreted, default: 20pts, sensitivity: [10pts, 30pts]}, {param: lookback before peak, basis: interpreted, default: 12m, sensitivity: [6m, 18m]}]
    H1: "Zero BEAR peaks without NAR in prior 12m (necessity); P(BEAR within 12m | NAR) reported (non-sufficiency expected)."
  test: {event: BEAR peaks, sample: "1926 -> 2026 (French daily industries; French 12 substitute, French 49 preferred)", frequency: W, outcome: "counterexample count; false-positive rate", holds_if: "zero counterexamples", fails_if: ">= 1 counterexample"}
  oos: {split: 2024-11-06, in_sample: "to 2024-10", out_of_sample: "2024-11 -> (2025 ~19% decline is below threshold; record only)"}
  data: {available: [FRENCH12_* (substitute), ETF_RSP, ETF_SPY (2021-09)], missing: ["FRENCH49 MISSING (12 industries too coarse for breadth)", "NYSE new highs/lows MISSING"]}
  caveats: ["Fast crashes (1987, 2020) are the decisive cases.", "With 12 industries the narrowing measure is noisy."]

- id: C-33
